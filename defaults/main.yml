# ------------------------------------------------------------------------------

# SPECIAL variables
# ---------------------------------------
# Ensure unused filesystems kernel modules are not available (cis_ubuntu2604_rule_1_1_1_11)
cis_ubuntu2604_fs_known_vulnerable:
  - afs
  - ceph
  - cifs
  - exfat
  - ext
  - fat
  - fscache
  - fuse
  - gfs2
  - nfs_common
  - nfsd
  - smbfs_common
cis_ubuntu2604_fs_ignored: # these filesystem won't be disabled
  - xfs
  - vfat
  - ext2
  - ext3
  - ext4

cis_ubuntu2604_rule_1_1_2_1_tmp_size: 2G
# cis_ubuntu2604_rule_1_1_2_2_shm_size: 2G

# bootloader password. 'random' makes random password (cis_ubuntu2604_rule_1_4_1)
cis_ubuntu2604_bootloader_password: random # pragma: allowlist secret
# grub default file path (cis_ubuntu2604_rule_1_3_1_2)
cis_ubuntu2604_default_grub_file: /etc/default/grub
# gdm banner message (cis_ubuntu2604_rule_1_7_1)
cis_ubuntu2604_warning_banner: Authorized users only. All activity may be monitored and reported.
# (cis_ubuntu2604_rule_1_7_3)
cis_ubuntu2604_rule_gdm_lock_delay: 5
cis_ubuntu2604_rule_gdm_idle_delay: 900

# choose time synchronization (cis_ubuntu2604_rule_2_3_1_1)
cis_ubuntu2604_time_synchronization_service: chrony # chrony | systemd-timesyncd
cis_ubuntu2604_time_synchronization_time_server:
  - uri: time.cloudflare.com
    config: iburst
  - uri: ntp.ubuntu.com
    config: iburst
  # NTS example (needs outbound TCP/4460):  - { uri: time.cloudflare.com, config: "iburst nts" }
  # 'type' may be 'server' (default) or 'pool'
# 26.04: keep Ubuntu-shipped NTS pools from /etc/chrony/sources.d in addition to the list above
cis_ubuntu2604_chrony_use_distro_sources: false
cis_ubuntu2604_chrony_use_dhcp_sources: false
# general path for sysctl conf file
cis_ubuntu2604_sysctl_file_path: /etc/sysctl.conf
# cron allow users (cis_ubuntu2604_rule_2_4_1_9)
cis_ubuntu2604_cron_allow_users:
  - root
# at allow users (cis_ubuntu2604_rule_2_4_2_1)
cis_ubuntu2604_at_allow_users:
  - root

# choose firewall (cis_ubuntu2604_rule_4_*)
cis_ubuntu2604_firewall: ufw # ufw | nftables | iptables
# define if outgoing traffic should be default deny or allow (cis_ubuntu2604_rule_4_1_3)
cis_ubuntu2604_firewall_ufw_outgoing_policy: deny
# defined nftable table name (cis_ubuntu2604_ext_nftables_4-9)
cis_ubuntu2604_firewall_nftables_table_name: filter

# (cis_ubuntu2604_ext_ufw_open_ports)
cis_ubuntu2604_firewall_rules_exist_open_ports:
  []
  # - rule: allow
  #   port: 80
  #   direction: in
  #   protocol: any
  #   comment: "allow http in"

# ssh conf's
# allows/denies for users/groups (cis_ubuntu2604_rule_5_1_5)
# 'optional:' cis_ubuntu2604_ssh_allow_users: root,user
# 'optional:' cis_ubuntu2604_ssh_allow_groups: root,ssh
# 'optional:' cis_ubuntu2604_ssh_deny_users: root,user
# 'optional:' cis_ubuntu2604_ssh_deny_groups: root,ssh
# Ciphers (cis_ubuntu2604_rule_5_1_7)
cis_ubuntu2604_ssh_ciphers:
  # - chacha20-poly1305@openssh.com # NOTE: (CVE-2023-48795)
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
# (cis_ubuntu2604_rule_5_1_8)
cis_ubuntu2604_ssh_client_alive_interval: 15
cis_ubuntu2604_ssh_client_alive_count_max: 3
# KexAlgorithms (cis_ubuntu2604_rule_5_1_13)
# 26.04 ships OpenSSH 10.2: hybrid post-quantum KEX is the default. Keep it first; OpenSSH 10.1+
# clients warn when a connection is not using a PQ KEX. Verify against the 26.04 benchmark's
# 5.1.12 weak list with CIS-CAT before changing.
cis_ubuntu2604_ssh_kex_algorithms:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - ecdh-sha2-nistp521
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp256
  - diffie-hellman-group-exchange-sha256
# 5.1.14: hybrid post-quantum KEX required by the 26.04 benchmark (OpenSSH >= 9.9)
cis_ubuntu2604_ssh_pq_kex:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512
cis_ubuntu2604_ssh_kex_algorithms_effective: >-
  {{ ((cis_ubuntu2604_ssh_pq_kex if cis_ubuntu2604_rule_5_1_14 | default(true) | bool else [])
      + cis_ubuntu2604_ssh_kex_algorithms) | unique }}
# log level (cis_ubuntu2604_rule_5_1_15)
cis_ubuntu2604_ssh_login_grace_time: 60
# log level (cis_ubuntu2604_rule_5_1_16)
cis_ubuntu2604_ssh_log_level: VERBOSE # VERBOSE | INFO
# MACs (cis_ubuntu2604_rule_5_1_17)
cis_ubuntu2604_ssh_macs:
  - hmac-sha2-512 # NOTE: FIPS 140 approved
  # - hmac-sha2-384 # NOTE: FIPS 140 approved - note available under ubuntu
  - hmac-sha2-256 # NOTE: FIPS 140 approved
  - hmac-sha1 # NOTE: FIPS 140 approved
  - umac-128@openssh.com
  # - hmac-sha2-512-etm@openssh.com # NOTE: (CVE-2023-48795)
  # - hmac-sha2-256-etm@openssh.com # NOTE: (CVE-2023-48795)
  # - umac-128-etm@openssh.com # NOTE: (CVE-2023-48795)
# (cis_ubuntu2604_rule_5_1_18)
cis_ubuntu2604_ssh_max_auth_tries: 4
# (cis_ubuntu2604_rule_5_1_19)
cis_ubuntu2604_ssh_max_sessions: 10
# (cis_ubuntu2604_rule_5_1_22)
cis_ubuntu2604_ssh_permit_root_login: "no"
# (cis_ubuntu2604_ext_ssh_hardening)
cis_ubuntu2604_ssh_port: 22
cis_ubuntu2604_ssh_address_family: "inet"
cis_ubuntu2604_ssh_authentication_methods: "publickey"
cis_ubuntu2604_ssh_password_authentication: "no"
cis_ubuntu2604_ssh_allow_agent_forwarding: "no"
cis_ubuntu2604_ssh_tcp_keep_alive: "no"
cis_ubuntu2604_ssh_x11_forwarding: "no"
cis_ubuntu2604_ssh_allow_tcp_forwarding: "no"
# (cis_ubuntu2604_ext_ssh_pubkey)
cis_ubuntu2604_ext_ssh_pubkey_user: "{{ ansible_user }}"
# cis_ubuntu2604_ext_ssh_pubkey_key: "<ADD_PUB_KEY>"

# (cis_ubuntu2604_rule_5_2_4)
cis_ubuntu2604_sudo_nopasswd_exceptions:
  - ubuntu
  - ec2-user
  - kennethnypi
  - angienypi
  - waseemnypi
  - ansible-user
  
# ------------------------------------------------------------------------------
# 26.04: sudo provider. 'sudo-rs' is the distro default; 'sudo.ws' is the original C sudo.
# sudo-rs has no 'logfile' option (syslog only) and no I/O logging, see rule 5.2.3 handling.
cis_ubuntu2604_sudo_provider: sudo-rs # sudo-rs | sudo.ws
# when true, the role pins /usr/bin/sudo to the provider above via update-alternatives
cis_ubuntu2604_manage_sudo_provider: false
# sudo-rs only: route syslog 'sudo' messages to cis_ubuntu2604_audit_sudo_log_file via rsyslog
# (compensating control for 5.2.3, keeps the 6.2.3.3 audit watch meaningful)
cis_ubuntu2604_sudo_rs_rsyslog_logfile: true

# (cis_ubuntu2604_rule_5_2_6)
cis_ubuntu2604_sudo_timestamp_timeout: 15 # 15 minutes or less as per your site policy

# (cis_ubuntu2604_rule_5_3_*)
cis_ubuntu2604_faillock_deny: 5
cis_ubuntu2604_faillock_unlock_time: 900
cis_ubuntu2604_faillock_difok: 2
cis_ubuntu2604_faillock_minlen: 14
cis_ubuntu2604_password_complexity:
  - key: "minclass"
    value: "3"
  - key: "dcredit"
    value: "-1"
  - key: "ucredit"
    value: "-1"
  - key: "lcredit"
    value: "-1"
  - key: "ocredit"
    value: "-1"
cis_ubuntu2604_faillock_maxrepeat: 3
cis_ubuntu2604_faillock_maxsequence: 3

# in file (pwhistory.j2)
cis_ubuntu2604_pwhistory_remember: remember=24
cis_ubuntu2604_pwhistory_enforce_for_root: enforce_for_root
cis_ubuntu2604_pwhistory_use_authtok: use_authtok

# in file (unix.j2) and (cis_ubuntu2604_rule_5_3_3_4_3|cis_ubuntu2604_rule_5_4_1_4)
cis_ubuntu2604_unix_encrypt_method: yescrypt # yescrypt | sha512
# in file (unix.j2) and (cis_ubuntu2604_rule_5_3_3_4_4)
cis_ubuntu2604_unix_use_authtok: "{{ cis_ubuntu2604_pwhistory_use_authtok }}"

cis_ubuntu2604_password_pass_max_days: 365
cis_ubuntu2604_password_pass_min_days: 1
cis_ubuntu2604_password_pass_warn_age: 7
cis_ubuntu2604_password_inactive: 45

# journald log file rotation (cis_ubuntu2604_rule_6_1_1_1_5)
cis_ubuntu2604_journald_system_max_use: 4G
cis_ubuntu2604_journald_system_keep_free: 8G
cis_ubuntu2604_journald_runtime_max_use: 256M
cis_ubuntu2604_journald_runtime_keep_free: 512M
cis_ubuntu2604_journald_max_file_sec: 1month

# preferred method for capturing logs (cis_ubuntu2604_ext_journald_no_forward, cis_ubuntu2604_rule_6_1_1_1_3)
cis_ubuntu2604_preferred_capturing_log_method: journald # journald | rsyslog

# systemd-journal-upload remote upload (cis_ubuntu2604_ext_journal_remote_install-4)
cis_ubuntu2604_set_journal_upload_url: null
cis_ubuntu2604_set_journal_upload_server_key_file: /etc/ssl/private/journal-upload.pem
cis_ubuntu2604_set_journal_upload_server_certificate_file: /etc/ssl/certs/journal-upload.pem
cis_ubuntu2604_set_journal_upload_trusted_certificate_file: /etc/ssl/ca/trusted.pem

# rsyslog remote log host (cis_ubuntu2604_rule_6_1_2_5)
cis_ubuntu2604_set_rsyslog_remote_target: null
cis_ubuntu2604_set_rsyslog_remote_port: 514
cis_ubuntu2604_set_rsyslog_remote_protocol: tcp
# 6.1.2.8-10 (L2): TLS (gtls) forwarding. Set port to 6514 when enabling.
cis_ubuntu2604_set_rsyslog_remote_tls: false
cis_ubuntu2604_set_rsyslog_remote_tls_authmode: x509/name # anon | x509/certvalid | x509/name
cis_ubuntu2604_set_rsyslog_remote_ca_file: /etc/ssl/certs/ca-certificates.crt

# audit backlog limit (cis_ubuntu2604_rule_6_2_1_4)
cis_ubuntu2604_audit_backlog_limit: 8192
# audit conf's (cis_ubuntu2604_rule_6_2_2_*)
cis_ubuntu2604_audit_max_log_file: 8
cis_ubuntu2604_audit_max_log_file_action: keep_logs
cis_ubuntu2604_audit_disk_full_action: halt # halt | single
cis_ubuntu2604_audit_disk_error_action: halt # halt | syslog | single
cis_ubuntu2604_audit_space_left_action: email # email | exec | single | halt
cis_ubuntu2604_audit_admin_space_left_action: single # single | halt
# (cis_ubuntu2604_rule_6_2_4_1-4)
cis_ubuntu2604_audit_log_path: /var/log/audit
# auditd group (cis_ubuntu2604_rule_6_2_4_3)
cis_ubuntu2604_audit_log_group: adm
# in file (cis_6_2_3_3.rules.j2) and (cis_ubuntu2604_rule_5_2_3)
cis_ubuntu2604_audit_sudo_log_file: /var/log/sudo.log
# in file (cis_6_2_3_6.rules.j2|cis_6_2_3_7.rules.j2|cis_6_2_3_9.rules.j2|cis_6_2_3_10.rules.j2|cis_6_2_3_13.rules.j2)
# in file (cis_6_2_3_15.rules.j2|cis_6_2_3_16.rules.j2|cis_6_2_3_17.rules.j2|cis_6_2_3_18.rules.j2|cis_6_2_3_19.rules.j2)
cis_ubuntu2604_audit_uid_min: 1000

# AIDE cron settings (cis_ubuntu2604_rule_6_3_2)
cis_ubuntu2604_aide_conf_file: /etc/aide/aide.conf

