# ------------------------------------------------------------------------------
# 26.04 specifics
# ------------------------------------------------------------------------------
cis_ubuntu2604_supported_versions:
  - "26.04"
# rebuild initrd (dracut by default on 26.04) when modprobe.d deny-lists change
cis_ubuntu2604_regenerate_initramfs: true
# 1.2.1.10/1.2.1.11: hosts to rewrite from http:// to https:// in APT sources (only if your mirror serves https)
cis_ubuntu2604_apt_https_hosts: []
#  - archive.ubuntu.com
#  - security.ubuntu.com
# 1.5.3: 1 (restricted), 2 (admin-only) or 3 (no attach)
cis_ubuntu2604_ptrace_scope: 1
# 1.5.8: 1 or 2
cis_ubuntu2604_kptr_restrict: 2
# 1.6.4: /etc/update-motd.d scripts that print OS/kernel/platform details (exec bit removed if present)
cis_ubuntu2604_update_motd_disable:
  - 00-header
  - 10-help-text
  - 10-uname
  - 50-landscape-sysinfo
  - 50-motd-news
  - 91-release-upgrade
  - 95-hwe-eol
# 3.2.7: site-unneeded network protocol modules (e.g. esp4, esp6, rxrpc - review IPsec/AFS needs first)
cis_ubuntu2604_net_modules_deny: []
