cis_ubuntu2604_regex_base_search: '^(#(\s)*)?'
cis_ubuntu2604_regex_base_search_equals: '\s*=.*$'
cis_ubuntu2604_shell_executable: /bin/bash
cis_ubuntu2604_print_info_join_by: "\n"

# SPECIAL options rule overview
# ---------------------------------------
# BOOTLOADER set (cis_ubuntu2604_rule_1_4_1)
cis_ubuntu2604_set_boot_pass: false
cis_ubuntu2604_disable_boot_pass: true
# autofs allow auto mount (cis_ubuntu2604_rule_1_7_4|cis_ubuntu2604_rule_1_7_4|cis_ubuntu2604_rule_2_1_1)
cis_ubuntu2604_allow_autofs: false
# gdm allow, else remove (cis_ubuntu2604_rule_1_7_*,cis_ubuntu2604_rule_2_1_21)
cis_ubuntu2604_allow_gdm_gui: false
# cups allow printer service, else remove (cis_ubuntu2604_rule_2_2_3)
cis_ubuntu2604_allow_cups: false
# ipv6 is required (cis_ubuntu2604_rule_3_1_1)
cis_ubuntu2604_required_ipv6: false
# cis_ubuntu2604_journal_upload_url (cis_ubuntu2604_ext_journal_remote_install-4)
cis_ubuntu2604_set_journal_upload: false
# cis_ubuntu2604_journal_upload_url (cis_ubuntu2604_rule_6_1_2_5)
cis_ubuntu2604_set_rsyslog_remote: false
# AIDE perform install/config (cis_ubuntu2604_rule_6_3_1-3)
cis_ubuntu2604_install_aide: true # NOTE: depends also on 'cis_ubuntu2604_config_aide'
cis_ubuntu2604_config_aide: true

