---
# tasks file for ansible-cis-ubuntu-2604

# ------------------------------------------------------------------------------

- name: "SECTION6 | 6.1.1.1.1 | Ensure journald service is active"
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    daemon_reload: true
    enabled: true
    masked: false
    state: started
  when:
    - cis_ubuntu2604_rule_6_1_1_1_1
  tags:
    - rule_6_1_1
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.1.1.2 | Ensure systemd-journal-remote service is not in use"
  when:
    - cis_ubuntu2604_rule_6_1_1_1_2
    - not cis_ubuntu2604_set_journal_upload | bool
  tags:
    - rule_6_1_2_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION6 | 6.1.1.1.2 | Ensure systemd-journal-remote service is not in use | check service available"
      ansible.builtin.shell: >
        set -o pipefail &&
        systemctl show systemd-journal-remote.service | grep -E 'LoadState|ActiveState' | cut -d = -f 2 | tr -d '\n'
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: service_status_systemd_journal_remote
      changed_when: false
      check_mode: false
    - name: "SECTION6 | 6.1.1.1.2 | Ensure systemd-journal-remote service is not in use | disable services"
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        daemon_reload: true
        enabled: false
        masked: true
        state: stopped
      with_items:
        - systemd-journal-remote.socket
        - systemd-journal-remote.service
      when:
        - service_status_systemd_journal_remote.stdout in ('loadedactive','loadedinactive')

- name: "SECTION6 | 6.1.1.1.3 | Ensure journald is configured to send logs to rsyslog"
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "{{ cis_ubuntu2604_regex_base_search }}ForwardToSyslog{{ cis_ubuntu2604_regex_base_search_equals }}"
    line: "ForwardToSyslog=yes"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald
  when:
    - cis_ubuntu2604_rule_6_1_1_1_3
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.1.1.4 | Ensure journald log file access is configured"
  when:
    - cis_ubuntu2604_rule_6_1_1_1_4
  tags:
    - rule_6_1_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION6 | 6.1.1.1.4 | Ensure journald log file access is configured | configure access"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      with_items:
        - path: /run/user
          mode: "0755"
        - path: /run/systemd/ask-password
          mode: "0755"
        - path: /run/systemd/seats
          mode: "0755"
        - path: /run/systemd/sessions
          mode: "0755"
        - path: /run/systemd/users
          mode: "0755"
        - path: /run/systemd/machines
          mode: "0755"
        - path: /run/systemd/shutdown
          mode: "0755"
        - path: /run/log
          mode: "0755"

        - path: /var/lib/systemd
          mode: "0755"
        - path: /var/lib/systemd/coredump
          mode: "0755"
        - path: /var/lib/systemd/ephemeral-trees
          mode: "0755"
        - path: /var/lib/private
          mode: "0700"

        - path: /var/log/private
          mode: "0700"
        - path: /var/cache/private
          mode: "0700"
    - name: "SECTION6 | 6.1.1.1.4 | Ensure journald log file access is configured | gather information"
      ansible.builtin.shell: |
        set -o pipefail
        {
          a_output=() a_output2=()
          l_systemd_config_file="/etc/tmpfiles.d/systemd.conf" l_analyze_cmd="$(readlink -f /bin/systemd-analyze)"
          f_file_chk()
          {
              l_maxperm="$( printf '%o' $(( 0777 & ~$l_perm_mask )) )"
              if [ $(( $l_mode & $l_perm_mask )) -le 0 ] || [[ "$l_type" = "Directory" && "$l_mode" =~ 275(0|5) ]]; then
                a_out+=("  - $l_type \"$l_logfile\" access is:" \
                "    mode: \"$l_mode\", owned by: \"$l_user\", and group owned by: \"$l_group\"")
              else
                a_out2+=("  - $l_type \"$l_logfile\" access is:" \
                "    mode: \"$l_mode\", owned by: \"$l_user\", and group owned by: \"$l_group\"" \
                "    should be mode: \"$l_maxperm\" or more restrictive")
              fi
          }
          while IFS= read -r l_file; do
              l_file="$(tr -d '# ' <<< "$l_file")" a_out=() a_out2=()
              l_logfile_perms_line="$(awk '($1~/^(f|d)$/ && $2~/^\// && $3~/[0-9]{3,}/){print $2 ":" $3 ":" $4 ":" $5}' "$l_file")"
              while IFS=: read -r l_logfile l_mode l_user l_group; do
                if [ -d "$l_logfile" ]; then
                    l_perm_mask="0027" l_type="Directory"
                    grep -Psq '^(\/run|\/var\/lib\/systemd)\b' <<< "$l_logfile" && l_perm_mask="0022"
                else
                    l_perm_mask="0137" l_type="File"
                fi
                grep -Psq '^(\/run|\/var\/lib\/systemd)\b' <<< "$l_logfile" && l_perm_mask="0022"
                f_file_chk
              done <<< "$l_logfile_perms_line"
              [ "${{ '{' }}#a_out[@]{{ '}' }}" -gt "0" ] && a_output+=(" - File: \"$l_file\" sets:" "${{ '{' }}a_out[@]{{ '}' }}")
              [ "${{ '{' }}#a_out2[@]{{ '}' }}" -gt "0" ] && a_output2+=(" - File: \"$l_file\" sets:" "${{ '{' }}a_out2[@]{{ '}' }}")
          done < <($l_analyze_cmd cat-config "$l_systemd_config_file" | tac | grep -Pio '^\h*#\h*\/[^#\n\r\h]+\.conf\b')
          if [ "${{ '{' }}#a_output2[@]{{ '}' }}" -le 0 ]; then
              printf '%s\n' "" "- Audit Result:" "  ** PASS **" "${{ '{' }}a_output[@]{{ '}' }}" ""
          else
              printf '%s\n' "" "- Audit Result:" "  ** REVIEW **" \
              " -  Review file access to ensure they are set IAW site policy:" "${{ '{' }}a_output2[@]{{ '}' }}"
              [ "${{ '{' }}#a_output[@]{{ '}' }}" -gt 0 ] && printf '%s\n' "" "- Correctly set:" "${{ '{' }}a_output[@]{{ '}' }}" ""
          fi
        }
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_journald_log_file_access
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION6 | 6.1.1.1.4 | Ensure journald log file access is configured | print info"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          verify:
          - systemd-journald logfiles are mode 0640 or more restrictive
          - Directories /run/ and /var/lib/systemd/ are mode 0755 or more restrictive
          - All other configured directories are mode 2755, 0750, or more restrictive
          #############################################################################################
          {{ cis_ubuntu2604_journald_log_file_access.stdout_lines | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################
      when:
        - cis_ubuntu2604_journald_log_file_access.stdout_lines is defined
        - cis_ubuntu2604_journald_log_file_access.stdout_lines | length > 0

- name: "SECTION6 | 6.1.1.1.5 | Ensure journald log file rotation is configured"
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "{{ item.reg }}"
    line: "{{ item.line }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0640"
  with_items:
    - reg: "{{ cis_ubuntu2604_regex_base_search }}SystemMaxUse{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "SystemMaxUse={{ cis_ubuntu2604_journald_system_max_use }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}SystemKeepFree{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "SystemKeepFree={{ cis_ubuntu2604_journald_system_keep_free }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}RuntimeMaxUse{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "RuntimeMaxUse={{ cis_ubuntu2604_journald_runtime_max_use }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}RuntimeKeepFree{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "RuntimeKeepFree={{ cis_ubuntu2604_journald_runtime_keep_free }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}MaxFileSec{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "MaxFileSec={{ cis_ubuntu2604_journald_max_file_sec }}"
  notify: Restart systemd-journald
  when:
    - cis_ubuntu2604_rule_6_1_1_1_5
  tags:
    - rule_6_1_1
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.1.1.6 | Ensure journald Storage is configured"
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "{{ cis_ubuntu2604_regex_base_search }}Storage{{ cis_ubuntu2604_regex_base_search_equals }}"
    line: "Storage=persistent"
    state: present
    create: true
    owner: root
    group: root
    mode: "0640"
  notify: Restart systemd-journald
  when:
    - cis_ubuntu2604_rule_6_1_1_1_6
  tags:
    - rule_6_1_2
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.1.1.7 | Ensure journald Compress is configured"
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "{{ cis_ubuntu2604_regex_base_search }}Compress{{ cis_ubuntu2604_regex_base_search_equals }}"
    line: "Compress=yes"
    state: present
    create: true
    owner: root
    group: root
    mode: "0640"
  notify: Restart systemd-journald
  when:
    - cis_ubuntu2604_rule_6_1_1_1_7
  tags:
    - rule_6_1_2
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION6 | EXT ext_journal_remote_install | Ensure systemd-journal-remote is installed"
  ansible.builtin.apt:
    name: systemd-journal-remote
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_ext_journal_remote_install
    - cis_ubuntu2604_set_journal_upload | bool
    - cis_ubuntu2604_preferred_capturing_log_method == "journald"
  tags:
    - rule_6_1_2_1
    - server_l1
    - workstation_l1

- name: "SECTION6 | EXT ext_journal_upload | Ensure systemd-journal-upload authentication is configured"
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journal-upload.conf
    regexp: "{{ item.reg }}"
    line: "{{ item.line }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0640"
    insertafter: "{{ item.insertafter }}"
  with_items:
    - reg: '\[Upload\]'
      line: "[Upload]"
      insertafter: "EOF"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}URL{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "URL={{ cis_ubuntu2604_set_journal_upload_url }}"
      insertafter: '\[Upload\]'
    - reg: "{{ cis_ubuntu2604_regex_base_search }}ServerKeyFile{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "ServerKeyFile={{ cis_ubuntu2604_set_journal_upload_server_key_file }}"
      insertafter: '\[Upload\]'
    - reg: "{{ cis_ubuntu2604_regex_base_search }}ServerCertificateFile{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "ServerCertificateFile={{ cis_ubuntu2604_set_journal_upload_server_certificate_file }}"
      insertafter: '\[Upload\]'
    - reg: "{{ cis_ubuntu2604_regex_base_search }}TrustedCertificateFile{{ cis_ubuntu2604_regex_base_search_equals }}"
      line: "TrustedCertificateFile={{ cis_ubuntu2604_set_journal_upload_trusted_certificate_file }}"
      insertafter: '\[Upload\]'
  notify: Restart systemd-journal-upload
  when:
    - cis_ubuntu2604_ext_journal_upload
    - cis_ubuntu2604_set_journal_upload | bool
    - cis_ubuntu2604_set_journal_upload_url is defined
    - cis_ubuntu2604_set_journal_upload_url is not none
    - cis_ubuntu2604_preferred_capturing_log_method == "journald"
  tags:
    - rule_6_1_2_1
    - server_l1
    - workstation_l1

- name: "SECTION6 | EXT ext_journald_no_forward | Ensure journald ForwardToSyslog is disabled"
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "{{ cis_ubuntu2604_regex_base_search }}ForwardToSyslog{{ cis_ubuntu2604_regex_base_search_equals }}"
    line: "ForwardToSyslog=no"
    state: present
    owner: root
    group: root
    mode: "0640"
  notify: Restart systemd-journald
  when:
    - cis_ubuntu2604_ext_journald_no_forward
    - cis_ubuntu2604_preferred_capturing_log_method == "journald"
  tags:
    - rule_6_1_2
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION6 | 6.1.2.1 | Ensure rsyslog is installed"
  ansible.builtin.apt:
    name: rsyslog
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_rule_6_1_2_1
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.2 | Ensure rsyslog service is enabled and active"
  ansible.builtin.systemd:
    name: rsyslog
    daemon_reload: true
    enabled: true
    masked: false
    state: started
  when:
    - cis_ubuntu2604_rule_6_1_2_2
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.3 | Ensure rsyslog log file creation mode is configured"
  ansible.builtin.lineinfile:
    dest: /etc/rsyslog.conf
    regexp: "{{ cis_ubuntu2604_regex_base_search }}$FileCreateMode "
    line: "$FileCreateMode 0640"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_3
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.4 | Ensure rsyslog logging is configured"
  ansible.builtin.template:
    src: 60-rsyslog.conf.j2
    dest: /etc/rsyslog.d/60-rsyslog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_4
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.5 | Ensure rsyslog is configured to send logs to a remote log host"
  ansible.builtin.template:
    src: 60-rsyslog.conf.j2
    dest: /etc/rsyslog.d/60-rsyslog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_5
    - cis_ubuntu2604_set_rsyslog_remote | bool
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.6 | Ensure rsyslog is not configured to receive logs from a remote client"
  ansible.builtin.lineinfile:
    dest: /etc/rsyslog.conf
    regexp: "{{ item.reg }}"
    line: "{{ item.line }}"
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
  with_items:
    - reg: '^module\(load="imtcp"\)'
      line: '#module(load="imtcp")'
    - reg: '^input\(type="imtcp" port="514"\)'
      line: '#input(type="imtcp" port="514")'
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_6
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.7 | Ensure logrotate is configured"
  ansible.builtin.template:
    src: logrotate.conf.j2
    dest: /etc/logrotate.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_7
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_3
    - server_l1
    - workstation_l1

- name: "SECTION6 | 6.1.2.8 | Ensure rsyslog-gnutls is installed"
  ansible.builtin.apt:
    name: rsyslog-gnutls
    state: present
    force_apt_get: true
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_8
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
  tags:
    - rule_6_1_2
    - server_l2
    - workstation_l2

# 6.1.2.9 / 6.1.2.10: the gtls stream driver and CA file are rendered into the forwarding action in
# templates/60-rsyslog.conf.j2 when cis_ubuntu2604_set_rsyslog_remote_tls is true (per-target form).
- name: "SECTION6 | 6.1.2.9 | Ensure rsyslog forwarding uses gtls"
  ansible.builtin.template:
    src: 60-rsyslog.conf.j2
    dest: /etc/rsyslog.d/60-rsyslog.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog
  when:
    - cis_ubuntu2604_rule_6_1_2_9
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
    - cis_ubuntu2604_set_rsyslog_remote | bool
    - cis_ubuntu2604_set_rsyslog_remote_tls | bool
  tags:
    - rule_6_1_2
    - server_l2
    - workstation_l2

- name: "SECTION6 | 6.1.2.10 | Ensure rsyslog CA certificates are configured"
  ansible.builtin.stat:
    path: "{{ cis_ubuntu2604_set_rsyslog_remote_ca_file }}"
  register: _cis_rsyslog_ca
  failed_when: not _cis_rsyslog_ca.stat.exists
  when:
    - cis_ubuntu2604_rule_6_1_2_10
    - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"
    - cis_ubuntu2604_set_rsyslog_remote | bool
    - cis_ubuntu2604_set_rsyslog_remote_tls | bool
  tags:
    - rule_6_1_2
    - server_l2
    - workstation_l2

# ------------------------------------------------------------------------------

- name: "SECTION6 | 6.1.3.1 | Ensure access to all logfiles has been configured"
  when:
    - cis_ubuntu2604_rule_6_1_3_1
  tags:
    - rule_6_1_4
    - server_l1
    - workstation_l1
    - molecule-idempotence-notest
  block:
    - name: "SECTION6 | 6.1.3.1 | Ensure access to all logfiles has been configured | find all files under '/var/log/'"
      ansible.builtin.find:
        paths: /var/log/
        file_type: file
        recurse: true
        excludes:
          - "*.journal"
          - "*.journal~"
      register: cis_ubuntu2604_logfiles
      changed_when: false
      check_mode: false

    - name: "SECTION6 | 6.1.3.1 | Ensure access to all logfiles has been configured | set logfile access"
      ansible.builtin.file:
        dest: "{{ item.path }}"
        state: file
        owner: "{{ logfiles_item_owner | default('root') }}"
        group: "{{ logfiles_item_group | default('adm') }}"
        mode: "{{ logfiles_item_mode | default('0640') }}"
      loop: "{{ cis_ubuntu2604_logfiles.files }}"
      loop_control:
        label: "{{ item.path }}"
      vars:
        logfiles_item_owner: "{{ cis_ubuntu2604_logfiles_access | selectattr('files', 'search', item.path | basename) | map(attribute='owner') | first }}"
        logfiles_item_group: "{{ cis_ubuntu2604_logfiles_access | selectattr('files', 'search', item.path | basename) | map(attribute='group') | first }}"
        logfiles_item_mode: "{{ cis_ubuntu2604_logfiles_access | selectattr('files', 'search', item.path | basename) | map(attribute='mode') | first }}"
      register: cis_ubuntu2604_rule_6_1_3_1_result
      failed_when: false
      changed_when: false
      
    - name: "SECTION6 | 6.1.3.1 | Log failures if any"
      ansible.builtin.debug:
        msg: "Failed to set access on {{ item.item.path }} → {{ item.msg }}"
      loop: "{{ cis_ubuntu2604_rule_6_1_3_1_result | selectattr('failed','defined') | selectattr('failed') | list }}"
      when: cis_ubuntu2604_rule_6_1_3_1_result is defined

# ------------------------------------------------------------------------------

- name: "SECTION6 | 6.2.1.1 | Ensure auditd packages are installed"
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_rule_6_2_1_1
  tags:
    - rule_6_2_1
    - server_l2
    - workstation_l2

- name: "SECTION6 | 6.2.1.2 | Ensure auditd service is enabled and active"
  ansible.builtin.systemd_service:
    name: auditd
    daemon_reload: true
    enabled: true
    masked: false
    state: started
  when:
    - cis_ubuntu2604_rule_6_2_1_2
    - ansible_virtualization_type != "docker"
  tags:
    - rule_6_2_1
    - server_l2
    - workstation_l2

- name: "SECTION6 | 6.2.1.3 | Ensure auditing for processes that start prior to auditd is enabled"
  when:
    - cis_ubuntu2604_rule_6_2_1_3
  tags:
    - rule_6_2_1
    - server_l2
    - workstation_l2
  block:
    - name: "SECTION6 | 6.2.1.3 | Ensure auditing for processes that start prior to auditd is enabled | grub add"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: '^(GRUB_CMDLINE_LINUX=\"(?!.*audit=)[^\"]*)(\".*)'
        replace: '\1 audit=1\2'
      notify: Update-grub
    - name: "SECTION6 | 6.2.1.3 | Ensure auditing for processes that start prior to auditd is enabled | grub replace"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: "audit=0"
        replace: "audit=1"
      notify: Update-grub

- name: "SECTION6 | 6.2.1.4 | Ensure audit_backlog_limit is configured"
  when:
    - cis_ubuntu2604_rule_6_2_1_4
  tags:
    - rule_6_2_1
    - server_l2
    - workstation_l2
  block:
    - name: "SECTION6 | 6.2.1.4 | Ensure audit_backlog_limit is sufficient | grub add"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
