        state: directory
        mode: "0750"
    - name: "SECTION6 | 6.2.4.3 | Ensure audit log files group owner is configured | set files group"
      ansible.builtin.shell: |
        set -o pipefail
        find {{ cis_ubuntu2604_audit_log_path }} -type f \( ! -group {{ cis_ubuntu2604_audit_log_group }} -a ! -group root \) -exec chgrp {{ cis_ubuntu2604_audit_log_group }} {} +
      args:
