- name: "SECTION6 | 6.2.3.10 | Ensure use of privileged commands are collected"
  when:
    - cis_ubuntu2604_rule_6_2_3_10
  tags:
    - rule_6_2_3
    - server_l2
    - workstation_l2
    - molecule-idempotence-notest
  block:
    - name: "SECTION6 | 6.2.3.10 | get list of setuid/setgid binaries (partitions without noexec/nosuid)"
      ansible.builtin.shell: |
        set -o pipefail
        for PARTITION in $(findmnt -n -l -k -it "$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)" | grep -Pv "noexec|nosuid" | awk '{print $1}'); do
          find "${PARTITION}" -xdev -perm /6000 -type f 2>/dev/null
        done
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_audit_proc_paths
      changed_when: false
      check_mode: false
    - name: "SECTION6 | 6.2.3.10 | set rule"
      ansible.builtin.template:
        src: audit/cis_6_2_3_10.rules.j2
        dest: /etc/audit/rules.d/cis_6_2_3_10.rules
        owner: root
        group: root
        mode: "0640"
      notify: Load audit rules

