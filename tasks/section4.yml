---
# tasks file for ansible-cis-ubuntu-2604

# ------------------------------------------------------------------------------

## NOTE: implicit in rules below
# 26.04 benchmark section 4 covers UFW only (4.1.1-4.1.5). nftables/iptables tasks and the extra
# UFW checks from the 24.04 benchmark are kept as non-CIS extensions (cis_ubuntu2604_ext_*).

- name: "SECTION4 | 4.1.1 | Ensure ufw is installed"
  ansible.builtin.apt:
    name: ufw
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_rule_4_1_1
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_ufw_no_iptables_persistent | Ensure iptables-persistent is not installed with ufw"
  ansible.builtin.apt:
    name: iptables-persistent
    state: absent
    purge: true
  when:
    - cis_ubuntu2604_ext_ufw_no_iptables_persistent
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | 4.1.2 | Ensure ufw service is configured"
  when:
    - cis_ubuntu2604_rule_4_1_2
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | 4.1.2 | Ensure ufw service is enabled | allow ssh"
      community.general.ufw:
        rule: allow
        direction: in
        from_ip: any
        to_ip: any
        to_port: 22
        protocol: tcp
        interface: "{{ ansible_default_ipv4['interface'] }}"
        log: true
        comment: "allow incoming connection on standard ssh port for interface {{ ansible_default_ipv4['interface'] }}"
      ignore_errors: false
    - name: "SECTION4 | 4.1.2 | Ensure ufw service is enabled | systemd"
      ansible.builtin.systemd_service:
        name: ufw.service
        daemon_reload: true
        enabled: true
        masked: false
        state: started
    - name: "SECTION4 | 4.1.2 | Enable UFW safely (non-interactive)"
      ansible.builtin.shell: |
        ufw --force enable
      args:
        executable: /bin/bash
      register: ufw_enable_result
      changed_when: "'already enabled' not in ufw_enable_result.stdout"
      failed_when: ufw_enable_result.rc not in [0]
      async: 60
      poll: 5
    - name: "SECTION4 | 4.1.2 | Ensure ufw service is enabled | Verify ufw is active"
      ansible.builtin.shell: 'ufw status | grep -q "Status: active"'
      register: ufw_status_check
      changed_when: false
      failed_when: ufw_status_check.rc != 0

- name: "SECTION4 | 4.1.2a | Ensure ufw Zabbix monitoring rules are present"
  when:
    - cis_ubuntu2604_rule_4_1_2
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1
    - zabbix
  block:
    - name: "SECTION4 | 4.1.2a | Allow incoming Zabbix agent (10050/tcp) from monitoring server"
      community.general.ufw:
        rule: allow
        direction: in
        proto: tcp
        from_ip: 10.20.193.184
        port: "10050"
        comment: "Zabbix server inbound agent checks"

    - name: "SECTION4 | 4.1.2a | Allow outgoing Zabbix agent communication (10051/tcp) to monitoring server"
      community.general.ufw:
        rule: allow
        direction: out
        proto: tcp
        to_ip: 10.20.193.184
        port: "10051"
        comment: "Zabbix agent outbound to server"

- name: "SECTION4 | 4.1.2b | Add dynamic and role-based firewall rules"
  when:
    - cis_ubuntu2604_rule_4_1_2
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - firewall
  block:

    - name: "SECTION4 | 4.1.2b | Detect open listening ports"
      ansible.builtin.shell: |
        ss -tuln | awk 'NR>1 {print $5}' | sed 's/.*://g' | sort -u
      register: detected_ports
      changed_when: false
      failed_when: false

    - name: "SECTION4 | 4.1.2b | Convert detected ports to list"
      ansible.builtin.set_fact:
        dynamic_ports: "{{ detected_ports.stdout_lines | map('int') | list }}"
      when: detected_ports.stdout_lines | length > 0

    - name: "SECTION4 | 4.1.2b | Set global ports always allowed (Splunk + Zabbix)"
      ansible.builtin.set_fact:
        global_ports:
          - { port: 8089, proto: tcp, comment: "Splunk management" }

    - name: "SECTION4 | 4.1.2b | Define role-based firewall profiles"
      ansible.builtin.set_fact:
        firewall_profiles:
          web_profile:
            - { port: 80, proto: tcp, comment: "HTTP" }
            - { port: 443, proto: tcp, comment: "HTTPS" }
            - { port: 8080, proto: tcp, comment: "Web Management" }
            - { port: "1024:2048", proto: tcp, comment: "Low dynamic range" }
            - { port: "32768:60999", proto: tcp, comment: "High dynamic range" }
          database_profile:
            - { port: 5432, proto: tcp, comment: "PostgreSQL" }
            - { port: 3306, proto: tcp, comment: "MySQL/MariaDB" }
            - { port: 1433, proto: tcp, comment: "MSSQL" }
          security_profile:
            - { port: 514, proto: tcp, comment: "Syslog" }
          default_profile:
            - { port: 22, proto: tcp, comment: "Default SSH access" }

    - name: "SECTION4 | 4.1.2b | Combine global, role, and dynamic rules"
      ansible.builtin.set_fact:
        combined_ports: >-
          {{
            global_ports
            + (
                firewall_role is defined
                and (firewall_profiles[firewall_role] | default([]))
                or []
              )
            + (dynamic_ports | map('regex_replace', '^(.*)$', '{"port": "\1", "proto": "tcp", "comment": "Detected open port"}') | map('from_json') | list)
          }}

    - name: "SECTION4 | 4.1.2b | Warn if firewall_role is not defined"
      ansible.builtin.debug:
        msg: "⚠️ Skipping role-based firewall configuration because firewall_role is not defined for {{ inventory_hostname }}"
      when: firewall_role is not defined

    - name: "SECTION4 | 4.1.2b | Debug combined firewall rules"
      ansible.builtin.debug:
        msg: "{{ combined_ports | to_nice_yaml }}"

    - name: "SECTION4 | 4.1.2b | Apply firewall rules"
      community.general.ufw:
        rule: allow
        direction: in
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        comment: "{{ item.comment }}"
      loop: "{{ combined_ports | unique }}"
      loop_control:
        label: "{{ item.comment }} ({{ item.port }}/{{ item.proto }})"
      ignore_errors: true

- name: "SECTION4 | EXT ext_ufw_loopback | Ensure ufw loopback traffic is configured"
  when:
    - cis_ubuntu2604_ext_ufw_loopback
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_ufw_loopback | Ensure ufw loopback traffic is configured | ingress allow in on lo"
      community.general.ufw:
        rule: allow
        direction: in
        interface: lo
        log: false
    - name: "SECTION4 | EXT ext_ufw_loopback | Ensure ufw loopback traffic is configured | egress allow out on lo"
      community.general.ufw:
        rule: allow
        direction: out
        interface: lo
        log: false
    - name: "SECTION4 | EXT ext_ufw_loopback | Ensure ufw loopback traffic is configured | ingress deny in from 127.0.0.0/8"
      community.general.ufw:
        rule: deny
        direction: in
        from: "127.0.0.0/8"
        log: false
    - name: "SECTION4 | EXT ext_ufw_loopback | Ensure ufw loopback traffic is configured | ingress deny in from ::1"
      community.general.ufw:
        rule: deny
        direction: in
        from: "::1"
        log: false
      when:
        - not cis_ubuntu2604_rule_3_1_1 or (cis_ubuntu2604_rule_3_1_1 and cis_ubuntu2604_required_ipv6)

- name: "SECTION4 | EXT ext_ufw_outbound | Ensure ufw outbound connections are configured"
  community.general.ufw:
    rule: allow
    direction: out
    to: any
    log: false
  when:
    - cis_ubuntu2604_ext_ufw_outbound
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_ufw_open_ports | Ensure ufw firewall rules exist for all open ports"
  community.general.ufw:
    rule: "{{ item.rule }}"
    direction: "{{ item.direction }}"
    port: "{{ item.port }}"
    protocol: "{{ item.protocol }}"
    log: "{{ item.log | default(true) }}"
    comment: "{{ item.comment }}"
  loop: "{{ cis_ubuntu2604_firewall_rules_exist_open_ports | flatten(levels=1) }}"
  when:
    - cis_ubuntu2604_ext_ufw_open_ports
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | 4.1.3 | Ensure ufw incoming default is configured"
  community.general.ufw:
    policy: deny
    direction: incoming
    log: true
  when:
    - cis_ubuntu2604_rule_4_1_3
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | 4.1.4 | Ensure ufw outgoing default is configured"
  community.general.ufw:
    policy: "{{ cis_ubuntu2604_firewall_ufw_outgoing_policy | default('deny') }}"
    direction: outgoing
    log: true
  when:
    - cis_ubuntu2604_rule_4_1_4
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l2
    - workstation_l2

- name: "SECTION4 | 4.1.5 | Ensure ufw routed default is configured"
  community.general.ufw:
    policy: deny
    direction: routed
    route: true
    log: true
  when:
    - cis_ubuntu2604_rule_4_1_5
    - cis_ubuntu2604_firewall == "ufw"
  tags:
    - rule_4_1
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION4 | EXT ext_nftables_1 | Ensure nftables is installed"
  ansible.builtin.apt:
    name: nftables
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_ext_nftables_1
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_2 | Ensure ufw is uninstalled or disabled with nftables"
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true
  when:
    - cis_ubuntu2604_ext_nftables_2
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_3 | Ensure iptables are flushed with nftables"
  when:
    - cis_ubuntu2604_ext_nftables_3
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_nftables_3 | Ensure iptables are flushed with nftables | ipv4"
      ansible.builtin.iptables:
        flush: true
        ip_version: ipv4
    - name: "SECTION4 | EXT ext_nftables_3 | Ensure iptables are flushed with nftables | ipv6"
      ansible.builtin.iptables:
        flush: true
        ip_version: ipv6

- name: "SECTION4 | EXT ext_nftables_4 | Ensure a nftables table exists"
  ansible.builtin.command: >
    nft create table inet {{ cis_ubuntu2604_firewall_nftables_table_name }}
  changed_when: false
  failed_when: false
  when:
    - cis_ubuntu2604_ext_nftables_4
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_5 | Ensure nftables base chains exist"
  ansible.builtin.command: >
    nft create chain inet {{ cis_ubuntu2604_firewall_nftables_table_name }} {{ item }} { type filter hook {{ item }} priority 0 \; }
  changed_when: false
  failed_when: false
  with_items:
    - input
    - forward
    - output
  when:
    - cis_ubuntu2604_ext_nftables_5
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_6 | Ensure nftables loopback traffic is configured"
  when:
    - cis_ubuntu2604_ext_nftables_6
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_nftables_6 | Ensure nftables loopback traffic is configured | ingress lo accept"
      ansible.builtin.command: >
        nft add rule inet {{ cis_ubuntu2604_firewall_nftables_table_name }} input iif lo accept
      changed_when: false
      failed_when: false
    - name: "SECTION4 | EXT ext_nftables_6 | Ensure nftables loopback traffic is configured | ingress 127.0.0.0/8 counter drop"
      ansible.builtin.command: >
        nft create rule inet {{ cis_ubuntu2604_firewall_nftables_table_name }} input ip saddr 127.0.0.0/8 counter drop
      changed_when: false
      failed_when: false
    - name: "SECTION4 | EXT ext_nftables_6 | Ensure nftables loopback traffic is configured | ingress ::1 counter drop"
      ansible.builtin.command: >
        nft add rule inet {{ cis_ubuntu2604_firewall_nftables_table_name }} input ip6 saddr ::1 counter drop
      changed_when: false
      failed_when: false

- name: "SECTION4 | EXT ext_nftables_7 | Ensure nftables outbound and established connections are configured"
  ansible.builtin.command: >
    nft add rule inet {{ cis_ubuntu2604_firewall_nftables_table_name }} {{ item.dir }} ip protocol {{ item.protocol }} ct state {{ item.state }} accept
  changed_when: false
  failed_when: false
  with_items:
    - dir: input
      protocol: tcp
      state: established
    - dir: input
      protocol: udp
      state: established
    - dir: input
      protocol: icmp
      state: established
    - dir: output
      protocol: tcp
      state: new,related,established
    - dir: output
      protocol: udp
      state: new,related,established
    - dir: output
      protocol: icmp
      state: new,related,established
  when:
    - cis_ubuntu2604_ext_nftables_7
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_8 | Ensure nftables default deny firewall policy"
  ansible.builtin.command: >
    nft chain inet {{ cis_ubuntu2604_firewall_nftables_table_name }} {{ item }} { policy drop \; }
  changed_when: false
  failed_when: false
  with_items:
    - input
    - forward
    - output
  when:
    - cis_ubuntu2604_ext_nftables_8
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_9 | Ensure nftables service is enabled"
  ansible.builtin.systemd_service:
    name: nftables
    daemon_reload: true
    enabled: true
    masked: false
    state: started
  when:
    - cis_ubuntu2604_ext_nftables_9
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_nftables_10 | Ensure nftables rules are permanent"
  ansible.builtin.command: >
    nft list table inet {{ cis_ubuntu2604_firewall_nftables_table_name }} > /etc/nftables.conf
  changed_when: false
  failed_when: false
  when:
    - cis_ubuntu2604_ext_nftables_10
    - cis_ubuntu2604_firewall == "nftables"
  tags:
    - rule_4_2
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION4 | EXT ext_iptables_1_1 | Ensure iptables packages are installed"
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_ext_iptables_1_1
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_iptables_1_2 | Ensure nftables is not in use with iptables"
  ansible.builtin.apt:
    name: nftables
    state: absent
    purge: true
  when:
    - cis_ubuntu2604_ext_iptables_1_2
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_1
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_iptables_1_3 | Ensure ufw is not in use with iptables"
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true
  when:
    - cis_ubuntu2604_ext_iptables_1_3
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_1
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION4 | EXT ext_iptables_2_1 | Ensure iptables default deny firewall policy"
  ansible.builtin.iptables:
    chain: "{{ item }}"
    policy: DROP
  loop:
    - INPUT
    - OUTPUT
    - FORWARD
  when:
    - cis_ubuntu2604_ext_iptables_2_1
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_2
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_iptables_2_2 | Ensure iptables loopback traffic is configured"
  when:
    - cis_ubuntu2604_ext_iptables_2_2
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_iptables_2_2 | Ensure iptables loopback traffic is configured | ingress lo allow"
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT
    - name: "SECTION4 | EXT ext_iptables_2_2 | Ensure iptables loopback traffic is configured | egress lo allow"
      ansible.builtin.iptables:
        chain: OUTPUT
        out_interface: lo
        jump: ACCEPT
    - name: "SECTION4 | EXT ext_iptables_2_2 | Ensure iptables loopback traffic is configured | ingress 127.0.0.0/8 deny"
      ansible.builtin.iptables:
        chain: INPUT
        source: 127.0.0.0/8
        jump: DROP

- name: "SECTION4 | EXT ext_iptables_2_3 | Ensure iptables outbound and established connections are configured"
  when:
    - cis_ubuntu2604_ext_iptables_2_3
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_iptables_2_3 | Ensure iptables outbound and established connections are configured | output"
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: "{{ item }}"
        ctstate: NEW,ESTABLISHED
        jump: ACCEPT
      with_items:
        - tcp
        - udp
        - icmp
    - name: "SECTION4 | EXT ext_iptables_2_3 | Ensure iptables outbound and established connections are configured | input "
      ansible.builtin.iptables:
        chain: INPUT
        protocol: "{{ item }}"
        ctstate: ESTABLISHED
        jump: ACCEPT
      with_items:
        - tcp
        - udp
        - icmp

- name: "SECTION4 | EXT ext_iptables_2_4 | Ensure iptables firewall rules exist for all open ports"
  when:
    - cis_ubuntu2604_ext_iptables_2_4
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_iptables_2_4 | Ensure iptables firewall rules exist for all open ports | ssh"
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 22
        ctstate: NEW
        jump: ACCEPT

# ------------------------------------------------------------------------------

- name: "SECTION4 | EXT ext_iptables_3_1 | Ensure ip6tables default deny firewall policy"
  ansible.builtin.iptables:
    chain: "{{ item }}"
    policy: DROP
    ip_version: ipv6
  loop:
    - INPUT
    - OUTPUT
    - FORWARD
  when:
    - cis_ubuntu2604_ext_iptables_3_1
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_3
    - server_l1
    - workstation_l1

- name: "SECTION4 | EXT ext_iptables_3_2 | Ensure ip6tables loopback traffic is configured"
  when:
    - cis_ubuntu2604_ext_iptables_3_2
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_3
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_iptables_3_2 | Ensure ip6tables loopback traffic is configured | ingress lo allow"
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT
        ip_version: ipv6
    - name: "SECTION4 | EXT ext_iptables_3_2 | Ensure ip6tables loopback traffic is configured | egress lo allow"
      ansible.builtin.iptables:
        chain: OUTPUT
        out_interface: lo
        jump: ACCEPT
        ip_version: ipv6
    - name: "SECTION4 | EXT ext_iptables_3_2 | Ensure ip6tables loopback traffic is configured | ingress ::1 deny"
      ansible.builtin.iptables:
        chain: INPUT
        source: ::1
        jump: DROP
        ip_version: ipv6

- name: "SECTION4 | EXT ext_iptables_3_3 | Ensure ip6tables outbound and established connections are configured"
  when:
    - cis_ubuntu2604_ext_iptables_3_3
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_3
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_iptables_3_3 | Ensure ip6tables outbound and established connections are configured | output"
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: "{{ item }}"
        ctstate: NEW,ESTABLISHED
        jump: ACCEPT
        ip_version: ipv6
      with_items:
        - tcp
        - udp
        - icmp
    - name: "SECTION4 | EXT ext_iptables_3_3 | Ensure ip6tables outbound and established connections are configured | input "
      ansible.builtin.iptables:
        chain: INPUT
        protocol: "{{ item }}"
        ctstate: ESTABLISHED
        jump: ACCEPT
        ip_version: ipv6
      with_items:
        - tcp
        - udp
        - icmp

- name: "SECTION4 | EXT ext_iptables_3_4 | Ensure ip6tables firewall rules exist for all open ports"
  when:
    - cis_ubuntu2604_ext_iptables_3_4
    - cis_ubuntu2604_firewall == "iptables"
  tags:
    - rule_4_3_3
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION4 | EXT ext_iptables_3_4 | Ensure ip6tables firewall rules exist for all open ports | ssh"
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: 22
        ctstate: NEW
        jump: ACCEPT
        ip_version: ipv6
