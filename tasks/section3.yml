- name: "SECTION3 | 3.2.1 | Ensure atm kernel module is not available"
  when:
    - cis_ubuntu2604_rule_3_2_1
  tags:
    - rule_3_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION3 | 3.2.1 | Ensure atm kernel module is not available | setting module and deny listing"
      notify: Regenerate initramfs
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/cis.conf
        regexp: "{{ item.reg }}"
        line: "{{ item.line }}"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section3_owner_default }}"
        group: "{{ cis_ubuntu2604_section3_group_default }}"
        mode: "{{ cis_ubuntu2604_section3_mode_default }}"
      with_items:
        - reg: '{{ cis_ubuntu2604_regex_base_search }}install atm(\s|$)'
          line: "install atm /bin/false"
        - reg: "{{ cis_ubuntu2604_regex_base_search }}blacklist atm$"
          line: "blacklist atm"
    - name: "SECTION3 | 3.2.1 | Ensure atm kernel module is not available | unloading module"
      community.general.modprobe:
        name: atm
        state: absent
      when: ansible_virtualization_type != "docker"

