# tasks file for ansible-cis-ubuntu-2604

# ------------------------------------------------------------------------------

- name: "SECTION3 | 3.1.1 | Ensure IPv6 status is identified"
  when:
    - cis_ubuntu2604_rule_3_1_1
  tags:
    - rule_3_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION3 | 3.1.1 | Ensure IPv6 status is identified | sysctl"
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "{{ 0 if cis_ubuntu2604_required_ipv6 else 1 }}"
        sysctl_file: "{{ cis_ubuntu2604_sysctl_file_path }}"
        sysctl_set: true
        state: present
        reload: true
        ignoreerrors: true
      with_items:
        - net.ipv6.conf.all.disable_ipv6
        - net.ipv6.conf.default.disable_ipv6
        # - net.ipv6.conf.lo.disable_ipv6
    - name: "SECTION3 | 3.1.1 | Ensure IPv6 status is identified | grub add"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: '^(GRUB_CMDLINE_LINUX=\"(?!.*ipv6.disable=)[^\"]*)(\".*)'
        replace: '\1 ipv6.disable={{ 0 if cis_ubuntu2604_required_ipv6 else 1 }}\2'
      notify: Update-grub
    - name: "SECTION3 | 3.1.1 | Ensure IPv6 status is identified | grub replace"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: "ipv6.disable={{ 0 if not cis_ubuntu2604_required_ipv6 else 1 }}"
        replace: "ipv6.disable={{ 0 if cis_ubuntu2604_required_ipv6 else 1 }}"
      notify: Update-grub

- name: "SECTION3 | 3.1.2 | Ensure wireless interfaces are not available"
  when:
    - cis_ubuntu2604_rule_3_1_2
    - ansible_virtualization_type != "docker"
  tags:
    - rule_3_1
    - server_l1
  block:
    - name: "SECTION3 | 3.1.2 | find wireless driver modules for the running kernel"
      ansible.builtin.find:
        paths: "/lib/modules/{{ ansible_kernel }}/kernel/drivers/net/wireless"
        patterns: "*.ko,*.ko.xz,*.ko.zst,*.ko.gz"
        recurse: true
      register: _cis_wireless_modules
    - name: "SECTION3 | 3.1.2 | deny-list wireless modules"
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-wireless.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible-cis-ubuntu-2604 - CIS 3.1.2
          {% for m in (_cis_wireless_modules.files | map(attribute='path') | map('basename')
                       | map('regex_replace', '\\.ko(\\.(xz|zst|gz))?$', '') | unique | sort) %}
          install {{ m }} /bin/false
          blacklist {{ m }}
          {% endfor %}
      notify: Regenerate initramfs
      when: _cis_wireless_modules.matched > 0

- name: "SECTION3 | 3.1.3 | Ensure bluetooth services are not in use"
  ansible.builtin.include_tasks: sub-task-services-clean.yml
  with_items:
    - title: "SECTION3 | 3.1.3 | Ensure bluetooth services are not in use"
      service:
        - bluetooth.service
      apt:
        - bluez
      disable: "{{ cis_ubuntu2604_rule_3_1_3 }}"
      remove: "{{ cis_ubuntu2604_rule_3_1_3_remove }}"
  loop_control:
    loop_var: outer_item
  when:
    - cis_ubuntu2604_rule_3_1_3 or cis_ubuntu2604_rule_3_1_3_remove
  tags:
    - rule_3_1
    - server_l1
    - workstation_l2

