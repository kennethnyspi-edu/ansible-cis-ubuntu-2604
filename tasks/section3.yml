- name: "SECTION3 | 3.2.7 | Ensure unneeded network protocol kernel modules are not available"
  when:
    - cis_ubuntu2604_rule_3_2_7
  tags:
    - rule_3_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION3 | 3.2.7 | deny-list site-defined unneeded network protocol modules"
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/cis-net-protocols.conf
        regexp: '^\s*{{ item.0 }}\s+{{ item.1 }}(\s|$)'
        line: "{{ item.0 }} {{ item.1 }}{{ ' /bin/false' if item.0 == 'install' else '' }}"
        create: true
        owner: root
        group: root
        mode: "0644"
      loop: "{{ ['install', 'blacklist'] | product(cis_ubuntu2604_net_modules_deny) | list }}"
      notify: Regenerate initramfs
    - name: "SECTION3 | 3.2.7 | list network protocol modules available in the running kernel (site review)"
      ansible.builtin.shell: >
        set -o pipefail &&
        find /lib/modules/"$(uname -r)"/kernel/net -type f -name '*.ko*' -printf '%f\n'
        | sed -E 's/\.ko(\.[xg]z|\.zst)?$//' | sort -u | paste -sd' '
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_net_modules
      changed_when: false
      check_mode: false
    - name: "SECTION3 | 3.2.7 | print info"
      ansible.builtin.debug:
        msg: >-
          Review against site inventory and add unneeded ones to cis_ubuntu2604_net_modules_deny:
          {{ _cis_net_modules.stdout }}

