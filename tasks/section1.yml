- name: "SECTION1 | 1.2.1.10 | Ensure repositories are set to https in /etc/apt/sources.list"
  when:
    - cis_ubuntu2604_rule_1_2_1_10
  tags:
    - rule_1_2_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.2.1.10 | report http:// repositories"
      ansible.builtin.shell: >
        grep -HnsP '^\s*(deb(-src)?\s+(\[[^]]*\]\s+)?|URIs:.*)http://' /etc/apt/sources.list || true
      register: _cis_http_repos
      changed_when: false
      check_mode: false
    - name: "SECTION1 | 1.2.1.10 | rewrite listed hosts to https (opt-in: cis_ubuntu2604_apt_https_hosts)"
      ansible.builtin.shell: |
        set -o pipefail
        for f in /etc/apt/sources.list; do
          [ -f "$f" ] || continue
          {% for h in cis_ubuntu2604_apt_https_hosts %}
          sed -ri 's#http://({{ h | regex_escape }})#https://\1#g' "$f"
          {% endfor %}
        done
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      when:
        - cis_ubuntu2604_apt_https_hosts | length > 0
        - _cis_http_repos.stdout | length > 0
    - name: "SECTION1 | 1.2.1.10 | print info"
      ansible.builtin.debug:
        msg: "{{ ['Repositories still using http:// (switch to https if the mirror supports it):'] + _cis_http_repos.stdout_lines }}"
      when: _cis_http_repos.stdout | length > 0

