- name: |
    SECTION1 | 1.1.2.5.2 | Ensure nodev option set on /var/tmp partition
    SECTION1 | 1.1.2.5.3 | Ensure nosuid option set on /var/tmp partition
    SECTION1 | 1.1.2.5.4 | Ensure noexec option set on /var/tmp partition
