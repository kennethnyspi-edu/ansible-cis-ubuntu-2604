          [ -f "$f" ] || continue
          [ "$f" = /etc/systemd/coredump.conf.d/60-coredump.conf ] && continue
          if grep -Pq '^\s*Storage\s*=\s*(?!none\s*$)' "$f"; then
            sed -ri '/^\s*Storage\s*=\s*none\s*$/!s/^(\s*Storage\s*=)/# \1/' "$f"; echo "CHANGED: $f"
          fi
        done
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_1_5_12
      changed_when: "'CHANGED:' in _cis_1_5_12.stdout"
      notify: Restart systemd-coredump
    - name: "SECTION1 | 1.5.12 | set Storage=none"
      community.general.ini_file:
        path: /etc/systemd/coredump.conf.d/60-coredump.conf
        section: Coredump
        option: Storage
        value: "none"
        no_extra_spaces: true
        owner: root
