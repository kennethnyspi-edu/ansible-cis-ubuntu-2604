- name: "SECTION1 | 1.2.1.1 | Ensure the source.list and .source files use the Signed-By option"
  when:
    - cis_ubuntu2604_rule_1_2_1_1
  tags:
    - rule_1_2_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.2.1.1 | find sources without Signed-By"
      ansible.builtin.shell: |
        set -o pipefail
        # deb822 .sources: every stanza needs Signed-By; one-line .list: every deb line needs [signed-by=]
        for f in /etc/apt/sources.list.d/*.sources; do
          [ -f "$f" ] || continue
          awk -v f="$f" 'BEGIN{RS="";FS="\n"} /(^|\n)[[:space:]]*Types:/ && !/(^|\n)[[:space:]]*Signed-By:/ && !/(^|\n)[[:space:]]*Enabled:[[:space:]]*no/ {print f": stanza without Signed-By"}' "$f"
        done
        grep -HnsP '^\s*deb(-src)?\s+(?!.*signed-by=)' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_apt_unsigned
      changed_when: false
      check_mode: false
    - name: "SECTION1 | 1.2.1.1 | keyring inventory"
      ansible.builtin.shell: |
        set -o pipefail
        for f in /etc/apt/trusted.gpg /etc/apt/trusted.gpg.d/* /etc/apt/keyrings/* /usr/share/keyrings/*; do
          [ -f "$f" ] || continue
          echo "== $f"
          gpg --no-default-keyring --show-keys --with-fingerprint --keyid-format long "$f" 2>/dev/null \
            | grep -E '^(pub|uid|      [0-9A-F ]{40,})' || echo "   (unreadable / not a keyring)"
        done
        echo "== Signed-By references in sources"
        grep -RHs -iE '^\s*Signed-By:|signed-by=' /etc/apt/sources.list /etc/apt/sources.list.d/ || true
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_apt_key_list
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION1 | 1.2.1.1 | print info (manual remediation per site policy)"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          1.2.1.1 sources without Signed-By (must be fixed manually):
          {{ (cis_ubuntu2604_apt_unsigned.stdout_lines | default([]) | join(cis_ubuntu2604_print_info_join_by)) or '  none' }}
          ---------------------------------------------------------------------------------------------
          {{ cis_ubuntu2604_apt_key_list.stdout_lines | default([]) | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################

- name: "SECTION1 | 1.2.1.2 | Ensure weak dependencies are configured"
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/60-no-weak-dependencies
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by ansible-cis-ubuntu-2604 - CIS 1.2.1.2
      APT::Install-Recommends "0";
      APT::Install-Suggests "0";
  when:
    - cis_ubuntu2604_rule_1_2_1_2
  tags:
    - rule_1_2_1
    - server_l2
    - workstation_l2

- name: "SECTION1 | 1.2.1.3 | Ensure access to gpg key files are configured"
  ansible.builtin.shell: |
    set -o pipefail
    # 0644 or stricter, root:root, for every keyring APT may use (trusted.gpg*, keyrings, Signed-By targets)
    { find /etc/apt/trusted.gpg /etc/apt/trusted.gpg.d /etc/apt/keyrings /usr/share/keyrings -maxdepth 1 -type f 2>/dev/null
      grep -RhoPs '(?i)(?<=signed-by[=:])\s*\K/[^\s\]]+' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null
    } | sort -u | while read -r f; do
      [ -f "$f" ] || continue
      if [ "$(stat -Lc '%u:%g' "$f")" != "0:0" ] || [ $(( 0$(stat -Lc '%a' "$f") & 0133 )) -ne 0 ]; then
        chown root:root "$f"; chmod u-x,go-wx "$f"; echo "CHANGED: $f"
      fi
    done
  args:
    executable: "{{ cis_ubuntu2604_shell_executable }}"
  register: cis_ubuntu2604_1_2_1_3
  changed_when: "'CHANGED:' in cis_ubuntu2604_1_2_1_3.stdout"
  when:
    - cis_ubuntu2604_rule_1_2_1_3
  tags:
    - rule_1_2_1
    - server_l1
    - workstation_l1

