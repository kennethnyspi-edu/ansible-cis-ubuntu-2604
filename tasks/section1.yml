      ansible.builtin.command: "/usr/sbin/apparmor_status --json"
      changed_when: false
      register: cis_ubuntu2604_apparmor_json_status
    - name: "SECTION1 | 1.3.1.3 | Ensure all AppArmor Profiles are enforcing | get unconfined & complain profiles"
      ansible.builtin.set_fact:
        cis_ubuntu2604_apparmor_update_to_enforce_profiles: "{{ (cis_ubuntu2604_apparmor_json_status.stdout | from_json).profiles | dict2items | selectattr('value', 'in', ['unconfined', 'complain']) | map(attribute='key') | list }}"
      when: cis_ubuntu2604_apparmor_update_to_enforce_profiles is not defined
    - name: "SECTION1 | 1.3.1.3 | Ensure all AppArmor Profiles are enforcing | apply unconfined into enforce"
      ansible.builtin.command: "/usr/sbin/aa-enforce {{ item }}"
      changed_when: false
      failed_when: false # NOTE: this should be later removed when bug for AppArmor is fixed
      loop: "{{ cis_ubuntu2604_apparmor_update_to_enforce_profiles }}"
      notify: Restart apparmor

