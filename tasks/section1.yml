- name: "SECTION1 | 1.3.1.1 | Ensure apparmor packages are installed"
  ansible.builtin.apt:
    name:
      - apparmor
      # 'apparmor-utils' installs 'aa-enforce'
      - apparmor-utils
    state: present
    force_apt_get: true
  notify: Restart apparmor
  when:
    - cis_ubuntu2604_rule_1_3_1_1
  tags:
    - rule_1_3_1
    - server_l1
    - workstation_l1

- name: "SECTION1 | 1.3.1.2 | Ensure AppArmor is enabled"
  when:
    - cis_ubuntu2604_rule_1_3_1_2
  tags:
    - rule_1_3_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.3.1.2 | Ensure AppArmor is enabled in the bootloader configuration | grub add - apparmor"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: '^(GRUB_CMDLINE_LINUX=\"(?!.*apparmor=)[^\"]*)(\".*)'
        replace: '\1 apparmor=1\2'
      notify: Update-grub
    - name: "SECTION1 | 1.3.1.2 | Ensure AppArmor is enabled in the bootloader configuration | grub replace - apparmor"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: 'apparmor=\d+'
        replace: "apparmor=1"
      notify: Update-grub
    - name: "SECTION1 | 1.3.1.2 | Ensure AppArmor is enabled in the bootloader configuration | grub add - security"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: '^(GRUB_CMDLINE_LINUX=\"(?!.*security=)[^\"]*)(\".*)'
        replace: '\1 security=apparmor\2'
      notify: Update-grub
    - name: "SECTION1 | 1.3.1.2 | Ensure AppArmor is enabled in the bootloader configuration | grub replace - security"
      ansible.builtin.replace:
        path: "{{ cis_ubuntu2604_default_grub_file }}"
        regexp: 'security=\w+'
        replace: "security=apparmor"
      notify: Update-grub

- name: "SECTION1 | EXT ext_apparmor_complain | Ensure all AppArmor Profiles are in enforce or complain mode"
  when:
    - cis_ubuntu2604_ext_apparmor_complain
  tags:
    - rule_1_3_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | EXT ext_apparmor_complain | Ensure all AppArmor Profiles are in enforce or complain mode | get status"
      ansible.builtin.command: "/usr/sbin/apparmor_status --json"
      changed_when: false
      register: cis_ubuntu2604_apparmor_json_status
    - name: "SECTION1 | EXT ext_apparmor_complain | Ensure all AppArmor Profiles are in enforce or complain mode | get unconfined profiles"
      ansible.builtin.set_fact:
        cis_ubuntu2604_apparmor_update_to_complain_profiles: "{{ (cis_ubuntu2604_apparmor_json_status.stdout | from_json).profiles | dict2items | selectattr('value', 'in', ['unconfined']) | map(attribute='key') | list }}"
      when: cis_ubuntu2604_apparmor_update_to_complain_profiles is not defined
    - name: "SECTION1 | EXT ext_apparmor_complain | Ensure all AppArmor Profiles are in enforce or complain mode | apply unconfined into complain"
      ansible.builtin.command: "/usr/sbin/aa-complain {{ item }}"
      changed_when: false
      failed_when: false # NOTE: this should be later removed when bug for AppArmor is fixed
      loop: "{{ cis_ubuntu2604_apparmor_update_to_complain_profiles }}"
      notify: Restart apparmor

- name: "SECTION1 | 1.3.1.3 | Ensure all AppArmor Profiles are enforcing"
  when:
    - cis_ubuntu2604_rule_1_3_1_3
  tags:
    - rule_1_3_1
    - server_l2
    - workstation_l2
  block:
