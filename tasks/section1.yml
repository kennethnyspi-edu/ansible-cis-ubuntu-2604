- name: "SECTION1 | 1.1.1.10 | Ensure usb-storage kernel module is not available"
  when:
    - cis_ubuntu2604_rule_1_1_1_10
  tags:
    - rule_1_1_1
    - server_l1
    - workstation_l2
  block:
    - name: >
        SECTION1 | 1.1.1.10 | Ensure usb-storage kernel module is not available | setting module and deny listing
      notify: Regenerate initramfs
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/cis.conf
        regexp: "{{ item.reg }}"
        line: "{{ item.line }}"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section1_owner_default }}"
        group: "{{ cis_ubuntu2604_section1_group_default }}"
        mode: "{{ cis_ubuntu2604_section1_mode_default }}"
      with_items:
        - reg: '{{ cis_ubuntu2604_regex_base_search }}install usb-storage(\s|$)'
          line: "install usb-storage /bin/false"
        - reg: "{{ cis_ubuntu2604_regex_base_search }}blacklist usb-storage$"
          line: "blacklist usb-storage"
    - name: >
        SECTION1 | 1.1.1.10 | Ensure usb-storage kernel module is not available | unloading module
      community.general.modprobe:
        name: usb-storage
        state: absent
      register: cis_1_1_1_10_modprobe_result
      failed_when:
        - cis_1_1_1_10_modprobe_result.rc is defined
        - cis_1_1_1_10_modprobe_result.rc != 0
        - "'in use' not in (cis_1_1_1_10_modprobe_result.stderr | default(''))"
      changed_when:
        - cis_1_1_1_10_modprobe_result.msg is not defined
        - cis_1_1_1_10_modprobe_result.state | default('') != 'absent'
      when: ansible_virtualization_type != "docker"

    - name: >
        SECTION1 | 1.1.1.10 | Ensure usb-storage kernel module is not available | warn if module in use
      ansible.builtin.debug:
        msg: >-
          WARNING: Host {{ inventory_hostname }}: usb_storage module is
          currently in use and could not be unloaded. Blacklisting applied
          — reboot required for full remediation.
      when:
        - ansible_virtualization_type != "docker"
        - cis_1_1_1_10_modprobe_result is defined
        - "'in use' in (cis_1_1_1_10_modprobe_result.stderr | default(''))"

    - name: >
        SECTION1 | 1.1.1.10 | Ensure usb-storage kernel module is not available | flag reboot required
      ansible.builtin.set_fact:
        cis_reboot_required: true
      when:
        - ansible_virtualization_type != "docker"
        - cis_1_1_1_10_modprobe_result is defined
        - "'in use' in (cis_1_1_1_10_modprobe_result.stderr | default(''))"

- name: "SECTION1 | 1.1.1.11 | Ensure unused filesystems kernel modules are not available"
  when:
    - cis_ubuntu2604_rule_1_1_1_11
  tags:
    - rule_1_1_1
    - server_l1
    - workstation_l1
  block:
    - name: >
        SECTION1 | 1.1.1.11 | Ensure unused filesystems kernel modules are not available | find mounted filesystems
      ansible.builtin.shell: >
        set -o pipefail && findmnt -knD | awk '{print $2}' | sort -u
      register: cis_ubuntu2604_mounted_filesystems
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      changed_when: false

    - name: >
        SECTION1 | 1.1.1.11 | Ensure unused filesystems kernel modules are not available | list available filesystem kernel modules
      ansible.builtin.find:
        paths: /lib/modules/{{ ansible_kernel }}/kernel/fs
        recurse: false
        file_type: directory
      register: cis_ubuntu2604_available_fs_modules

    - name: >
        SECTION1 | 1.1.1.11 | Ensure unused filesystems kernel modules are not available | check and unload loaded vulnerable filesystems
      ansible.builtin.include_tasks: section1-1_1_1_10.yml
      loop: "{{ cis_ubuntu2604_available_fs_modules.files | map(attribute='path') | map('basename') }}"
      loop_control:
        loop_var: cis_ubuntu2604_fs_module_file
      when:
        - cis_ubuntu2604_fs_module_file in cis_ubuntu2604_fs_known_vulnerable
        - cis_ubuntu2604_fs_module_file not in cis_ubuntu2604_fs_ignored

