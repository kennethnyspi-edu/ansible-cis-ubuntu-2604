      ansible.builtin.lineinfile:
        dest: /etc/default/apport
        regexp: "{{ cis_ubuntu2604_regex_base_search }}enabled{{ cis_ubuntu2604_regex_base_search_equals }}"
        line: "enabled=0"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section1_owner_default }}"
        group: "{{ cis_ubuntu2604_section1_group_default }}"
        mode: "{{ cis_ubuntu2604_section1_mode_default }}"
    - name: >
