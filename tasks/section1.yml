# ------------------------------------------------------------------------------

# 1.1.2.3.1 / 1.1.2.4.1 / 1.1.2.5.1 / 1.1.2.6.1 / 1.1.2.7.1 (separate partition exists) cannot be remediated
# by Ansible without repartitioning. The option rules below are applied only when the mount point already
# is a separate mount (findmnt), so hosts without the partition are left untouched.
- name: "SECTION1 | 1.1.2.3-7 | gather separate mounts"
  ansible.builtin.command: findmnt -kn -o TARGET,OPTIONS
  register: cis_ubuntu2604_findmnt
  changed_when: false
  check_mode: false
  tags:
    - rule_1_1_2
    - server_l1
    - workstation_l1

- name: |
    SECTION1 | 1.1.2.3.2 | Ensure nodev option set on /home partition
    SECTION1 | 1.1.2.3.3 | Ensure nosuid option set on /home partition
  vars:
    _cis_mp: "/home"
    _cis_line: "{{ cis_ubuntu2604_findmnt.stdout_lines | select('match', '^' ~ _cis_mp ~ '\\s') | first | default('') }}"
    _cis_want: "{{ (['nodev'] if cis_ubuntu2604_rule_1_1_2_3_2 else []) + (['nosuid'] if cis_ubuntu2604_rule_1_1_2_3_3 else []) }}"
    _cis_have: "{{ (_cis_line.split() | last | default('')).split(',') if _cis_line else [] }}"
  when:
    - _cis_line | length > 0
    - (_cis_want | difference(_cis_have)) | length > 0
  tags:
    - rule_1_1_2_3
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.1.2.3 | read fstab entry for /home"
      ansible.builtin.shell: >
        set -o pipefail &&
        awk '$1 !~ /^#/ && $2 == "/home" {print $1" "$3" "$4}' /etc/fstab | head -n1
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_fstab
      changed_when: false
      check_mode: false
    - name: "SECTION1 | 1.1.2.3 | add {{ _cis_want | join(',') }} to /home in fstab and remount"
      ansible.posix.mount:
        path: "/home"
        src: "{{ _cis_fstab.stdout.split()[0] }}"
        fstype: "{{ _cis_fstab.stdout.split()[1] }}"
        opts: "{{ (_cis_fstab.stdout.split()[2].split(',') + _cis_want) | unique | join(',') }}"
        state: mounted
      when: _cis_fstab.stdout | length > 0

- name: |
    SECTION1 | 1.1.2.4.2 | Ensure nodev option set on /var partition
    SECTION1 | 1.1.2.4.3 | Ensure nosuid option set on /var partition
  vars:
    _cis_mp: "/var"
    _cis_line: "{{ cis_ubuntu2604_findmnt.stdout_lines | select('match', '^' ~ _cis_mp ~ '\\s') | first | default('') }}"
