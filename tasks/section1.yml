    - rule_1_6
    - server_l1
    - workstation_l1

- name: "SECTION1 | 1.6.9 | Ensure access to pam_motd file is configured"
  when:
    - cis_ubuntu2604_rule_1_6_9
  tags:
    - rule_1_6
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.6.9 | find motd= files referenced by pam_motd"
      ansible.builtin.shell: set -o pipefail && grep -hPo 'pam_motd\.so.*\bmotd=\K\S+' /etc/pam.d/* 2>/dev/null | sort -u
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_pam_motd_files
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION1 | 1.6.9 | stat motd files"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ _cis_pam_motd_files.stdout_lines | default([]) }}"
      register: _cis_pam_motd_stat
    - name: "SECTION1 | 1.6.9 | root:root, u-x,go-wx"
      ansible.builtin.file:
        path: "{{ item.item }}"
        owner: root
        group: root
        mode: "u-x,go-wx"
      loop: "{{ _cis_pam_motd_stat.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

- name: "SECTION1 | 1.6.10 | Ensure access to sshd warning banner is configured"
  ansible.builtin.file:
    path: "{{ (cis_ubuntu2604_sshd_banner_file.stdout | default('') not in ['', 'none']) | ternary(cis_ubuntu2604_sshd_banner_file.stdout, '/etc/issue.net') }}"
