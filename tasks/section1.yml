- name: "SECTION1 | 1.3.1.4 | Ensure kernel.apparmor_restrict_unprivileged_unconfined is enabled"
  ansible.builtin.include_tasks:
    file: sub-task-sysctl.yml
    apply:
      tags: [rule_1_3_1, server_l1, workstation_l1]
  vars:
    cis_sysctl_name: kernel.apparmor_restrict_unprivileged_unconfined
    cis_sysctl_value: "1"
    cis_sysctl_ok: "1"
  when:
    - cis_ubuntu2604_rule_1_3_1_4
  tags:
    - rule_1_3_1
    - server_l1
    - workstation_l1

- name: "SECTION1 | 1.4.1 | Ensure bootloader password is set"
  when:
    - cis_ubuntu2604_rule_1_4_1
    - cis_ubuntu2604_set_boot_pass
  tags:
    - rule_1_4
    - server_l1
    - workstation_l1
    - molecule-idempotence-notest
  block:
    - name: "SECTION1 | 1.4.1 | Ensure bootloader password is set | generate password"
      ansible.builtin.shell: |
        set -o pipefail &&
          if [ '{{ cis_ubuntu2604_bootloader_password }}' == 'random' ]; then
            PASSWORD=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c12)
          else
            PASSWORD='{{ cis_ubuntu2604_bootloader_password }}'
          fi
        echo -e "$PASSWORD\n$PASSWORD" | grub-mkpasswd-pbkdf2 --iteration-count=600000 --salt=64 | awk '/grub.pbkdf/{print$NF}'
      register: cis_ubuntu2604_grub_bootloader_password
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      changed_when: false
    - name: "SECTION1 | 1.4.1 | Ensure bootloader password is set | generate config"
      ansible.builtin.copy:
        dest: /etc/grub.d/00_password
        content: "cat << EOF\nexec tail -n +2 $0\nset superusers=\"root\"\npassword_pbkdf2 root {{ cis_ubuntu2604_grub_bootloader_password.stdout }}\nEOF"
        owner: "{{ cis_ubuntu2604_section1_owner_default }}"
        group: "{{ cis_ubuntu2604_section1_group_default }}"
        mode: "{{ cis_ubuntu2604_section1_mode_etc_grub_d }}"
      notify: Generate new grub config
      when:
        - cis_ubuntu2604_grub_bootloader_password is defined
        - cis_ubuntu2604_grub_bootloader_password.stdout is defined
        - cis_ubuntu2604_grub_bootloader_password.stdout | length > 0
    - name: "SECTION1 | 1.4.1 | Ensure bootloader password is set | disable password for system boot"
      ansible.builtin.replace:
        path: /etc/grub.d/10_linux
        regexp: '--class os"'
        replace: '--class os --unrestricted"'
      notify: Generate new grub config
      when:
        - cis_ubuntu2604_disable_boot_pass

- name: "SECTION1 | 1.4.2 | Ensure access to bootloader config is configured"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ cis_ubuntu2604_section1_owner_default }}"
    group: "{{ cis_ubuntu2604_section1_group_default }}"
    mode: "{{ cis_ubuntu2604_section1_mode_boot_grub }}"
  with_items:
    - path: /boot/grub/grub.cfg
      check: "{{ cis_grub_cfg.stat.exists }}"
    - path: /boot/grub/grub.conf
      check: "{{ cis_grub_conf.stat.exists }}"
    - path: /boot/grub/menu.lst
      check: "{{ cis_menu_lst.stat.exists }}"
  when:
    - cis_ubuntu2604_rule_1_4_2
    - item.check | bool
  tags:
    - rule_1_4
    - server_l1
    - workstation_l1

