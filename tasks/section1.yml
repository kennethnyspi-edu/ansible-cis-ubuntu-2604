    - workstation_l1

- name: "SECTION1 | 1.6.4 | Ensure pam_motd is configured"
  when:
    - cis_ubuntu2604_rule_1_6_4
  tags:
    - rule_1_6
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.6.4 | find update-motd.d scripts that reveal OS/platform information"
      ansible.builtin.stat:
        path: "/etc/update-motd.d/{{ item }}"
      loop: "{{ cis_ubuntu2604_update_motd_disable }}"
      register: _cis_motd_scripts
    - name: "SECTION1 | 1.6.4 | remove execute bit (run-parts skips them)"
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        mode: "a-x"
      loop: "{{ _cis_motd_scripts.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.executable | default(false)

- name: "SECTION1 | 1.6.5 | Ensure sshd warning Banner is configured"
  when:
    - cis_ubuntu2604_rule_1_6_5
  tags:
    - rule_1_6
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.6.5 | get the sshd Banner file"
      ansible.builtin.shell: set -o pipefail && sshd -T 2>/dev/null | awk '$1 == "banner" {print $2}'
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_sshd_banner_file
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION1 | 1.6.5 | write site banner (skipped when Banner is /etc/issue.net, handled by 1.6.3)"
      ansible.builtin.copy:
        dest: "{{ cis_ubuntu2604_sshd_banner_file.stdout }}"
        content: |
          {{ cis_ubuntu2604_warning_banner }}
        owner: root
        group: root
        mode: "0644"
      when:
        - cis_ubuntu2604_sshd_banner_file.stdout | default('none') not in ['', 'none', '/etc/issue.net']

