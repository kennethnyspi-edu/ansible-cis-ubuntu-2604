- name: "SECTION1 | 1.5.10 | Ensure core file size is configured"
  when:
    - cis_ubuntu2604_rule_1_5_10
  tags:
    - rule_1_5
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.5.10 | comment out non-zero hard core limits"
      ansible.builtin.shell: |
        set -o pipefail
        for f in /etc/security/limits.conf /etc/security/limits.d/*; do
          [ -f "$f" ] || continue
          [ "$f" = /etc/security/limits.d/60-limits.conf ] && continue
          if grep -Pq '^\s*[^#\s]+\s+hard\s+core\s+([1-9][0-9]*|unlimited|infinity)\b' "$f"; then
            sed -ri '/^\s*[^#[:space:]]+\s+hard\s+core\s+([1-9][0-9]*|unlimited|infinity)/s/^/# /' "$f"; echo "CHANGED: $f"
          fi
        done
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_1_5_10
      changed_when: "'CHANGED:' in _cis_1_5_10.stdout"
    - name: "SECTION1 | 1.5.10 | set '* hard core 0'"
      ansible.builtin.lineinfile:
        path: /etc/security/limits.d/60-limits.conf
        regexp: '^\s*\*\s+hard\s+core\s+'
        line: "*    hard    core    0"
        create: true
        owner: root
        group: root
        mode: "0644"

- name: "SECTION1 | 1.5.11 | Ensure systemd-coredump ProcessSizeMax is configured"
  when:
    - cis_ubuntu2604_rule_1_5_11
  tags:
    - rule_1_5
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.5.11 | comment out other ProcessSizeMax= in coredump config"
      ansible.builtin.shell: |
        set -o pipefail
        for f in /etc/systemd/coredump.conf /etc/systemd/coredump.conf.d/*.conf /run/systemd/coredump.conf.d/*.conf /usr/lib/systemd/coredump.conf.d/*.conf; do
          [ -f "$f" ] || continue
          [ "$f" = /etc/systemd/coredump.conf.d/60-coredump.conf ] && continue
          if grep -Pq '^\s*ProcessSizeMax\s*=\s*(?!0\s*$)' "$f"; then
            sed -ri '/^\s*ProcessSizeMax\s*=\s*0\s*$/!s/^(\s*ProcessSizeMax\s*=)/# \1/' "$f"; echo "CHANGED: $f"
          fi
        done
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_1_5_11
      changed_when: "'CHANGED:' in _cis_1_5_11.stdout"
      notify: Restart systemd-coredump
    - name: "SECTION1 | 1.5.11 | set ProcessSizeMax=0"
      community.general.ini_file:
        path: /etc/systemd/coredump.conf.d/60-coredump.conf
        section: Coredump
        option: ProcessSizeMax
        value: "0"
        no_extra_spaces: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-coredump

- name: "SECTION1 | 1.5.12 | Ensure systemd-coredump Storage is configured"
  when:
