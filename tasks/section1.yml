    _cis_have: "{{ (_cis_line.split() | last | default('')).split(',') if _cis_line else [] }}"
  when:
    - _cis_line | length > 0
    - (_cis_want | difference(_cis_have)) | length > 0
  tags:
    - rule_1_1_2_4
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION1 | 1.1.2.4 | read fstab entry for /var"
      ansible.builtin.shell: >
