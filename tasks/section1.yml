- name: "SECTION1 | 1.1.1.1 | Ensure cramfs kernel module is not available"
  when:
    - cis_ubuntu2604_rule_1_1_1_1
  tags:
    - rule_1_1_1
    - server_l1
    - workstation_l1
  block:
    - name: >
        SECTION1 | 1.1.1.1 | Ensure cramfs kernel module is not available | setting module and deny listing
      notify: Regenerate initramfs
      ansible.builtin.lineinfile:
        dest: /etc/modprobe.d/cis.conf
        regexp: "{{ item.reg }}"
        line: "{{ item.line }}"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section1_owner_default }}"
        group: "{{ cis_ubuntu2604_section1_group_default }}"
        mode: "{{ cis_ubuntu2604_section1_mode_default }}"
      with_items:
        - reg: '{{ cis_ubuntu2604_regex_base_search }}install cramfs(\s|$)'
          line: "install cramfs /bin/false"
        - reg: "{{ cis_ubuntu2604_regex_base_search }}blacklist cramfs$"
          line: "blacklist cramfs"
    - name: >
        SECTION1 | 1.1.1.1 | Ensure cramfs kernel module is not available | unloading module
      community.general.modprobe:
        name: cramfs
        state: absent
      when: ansible_virtualization_type != "docker"

