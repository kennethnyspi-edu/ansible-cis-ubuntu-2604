---
# Generic CIS 26.04 sysctl remediation (1.3.1.4, 1.5.x, 3.3.x):
#  1. comment out non-compliant entries in every file systemd-sysctl reads, plus UFW's IPT_SYSCTL file
#     (the 26.04 benchmark calls UFW's /etc/ufw/sysctl.conf out explicitly: it is applied after boot)
#  2. set the value in cis_ubuntu2604_sysctl_file_path and in the running kernel
# Inputs: cis_sysctl_name, cis_sysctl_value, cis_sysctl_ok (regex alternation of compliant values)

- name: "SYSCTL | {{ cis_sysctl_name }} | comment out non-compliant entries in other sysctl files"
  ansible.builtin.shell: |
    set -o pipefail
    opt='{{ cis_sysctl_name }}'; ok='{{ cis_sysctl_ok }}'
    target="$(readlink -f '{{ cis_ubuntu2604_sysctl_file_path }}')"
    re="${opt//./[./]}"
    sd="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
    files=()
    ufw="$(awk -F= '/^\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw 2>/dev/null)"
    [ -n "$ufw" ] && [ -f "$ufw" ] && files+=("$ufw")
    [ -f /etc/sysctl.conf ] && files+=("/etc/sysctl.conf")
    while IFS= read -r f; do files+=("$f"); done < <("$sd" --cat-config 2>/dev/null | grep -Po '^#\s*\K/\S+\.conf\b')
    for f in "${files[@]}"; do
      real="$(readlink -e "$f")" || continue
      [ "$real" = "$target" ] && continue
      if grep -Pq "^\s*${re}\s*=\s*(?!(${ok})\s*$)\S" "$real"; then
        sed -ri "/^\s*${re}\s*=/{/=\s*(${ok})\s*$/!s/^/# CIS commented: /}" "$real"
        echo "CHANGED: $real"
      fi
    done
  args:
    executable: "{{ cis_ubuntu2604_shell_executable }}"
  register: cis_ubuntu2604_sysctl_cleanup
  changed_when: "'CHANGED:' in cis_ubuntu2604_sysctl_cleanup.stdout"
  failed_when: false

- name: "SYSCTL | {{ cis_sysctl_name }} | set {{ cis_sysctl_value }}"
  ansible.posix.sysctl:
    name: "{{ cis_sysctl_name }}"
    value: "{{ cis_sysctl_value }}"
    sysctl_file: "{{ cis_ubuntu2604_sysctl_file_path }}"
    sysctl_set: true
    state: present
    reload: true
    ignoreerrors: true
