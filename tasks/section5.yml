- name: "SECTION5 | 5.4.2.8 | Ensure accounts without a valid login shell are locked"
  ansible.builtin.shell: |
    set -o pipefail
    {
      l_valid_shells="^($(awk -F\/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' - ))$"
      while IFS= read -r l_user; do
          passwd -S "$l_user" | awk '$2 !~ /^L/ {system ("usermod -L " $1)}'
      done < <(awk -v pat="$l_valid_shells" -F: '($1 != "root" && $(NF) !~ pat) {print $1}' /etc/passwd)
    }
  args:
    executable: "{{ cis_ubuntu2604_shell_executable }}"
  changed_when: false
  when:
    - cis_ubuntu2604_rule_5_4_2_8
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION5 | 5.4.3.1 | Ensure nologin is not listed in /etc/shells"
  ansible.builtin.lineinfile:
    path: /etc/shells
    state: absent
    regexp: "^.*nologin.*$"
  when:
    - cis_ubuntu2604_rule_5_4_3_1
  tags:
    - rule_5_4_3
    - server_l2
    - workstation_l2

- name: "SECTION5 | 5.4.3.2 | Ensure default user shell timeout is configured"
  when:
    - cis_ubuntu2604_rule_5_4_3_2
  tags:
    - rule_5_4_3
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.3.2 | Deploy TMOUT profile script"
      ansible.builtin.copy:
        dest: /etc/profile.d/99-tmout.sh
        owner: root
        group: root
        mode: "0644"
        content: |
          #!/bin/bash
          # CIS 5.4.3.2 - Ensure default user shell timeout is 900 seconds or less
          # XRDP-safe: applies only to interactive shells

          if [ -n "$PS1" ]; then
              TMOUT=900
              readonly TMOUT
              export TMOUT
          fi

- name: "SECTION5 | 5.4.3.3 | Ensure default user umask is configured"
  when:
    - cis_ubuntu2604_rule_5_4_3_3
  tags:
    - rule_5_4_3
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.3.3 | Ensure default user umask is configured | remove existing umask"
      ansible.builtin.lineinfile:
        dest: "{{ item }}"
        regexp: '{{ cis_ubuntu2604_regex_base_search }}umask\s+\d+'
        state: absent
      with_items:
        - /etc/profile
        - /etc/bash.bashrc
        - /etc/bashrc
        # - /etc/pam.d/postlogin
        - /etc/login.defs
        # - /etc/default/login
    - name: "SECTION5 | 5.4.3.3 | Ensure default user umask is configured | add umask line"
      ansible.builtin.lineinfile:
        dest: /etc/profile.d/99-umask.sh
        regexp: '{{ cis_ubuntu2604_regex_base_search }}umask\s+\d+'
        line: "umask 0027"
        state: present
        create: true
        owner: root
        group: root
        mode: "0644"
