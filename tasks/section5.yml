- name: "SECTION5 | 5.1.13 | Ensure sshd KexAlgorithms is configured"
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ cis_ubuntu2604_regex_base_search }}KexAlgorithms"
    # 5.1.14: PQ hybrid KEX algorithms are prepended when the rule is enabled (see defaults)
    line: "KexAlgorithms {{ cis_ubuntu2604_ssh_kex_algorithms_effective | join(',') }}"
    state: present
    create: true
    owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
    group: "{{ cis_ubuntu2604_section5_group_ssh }}"
    mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
  when:
    - cis_ubuntu2604_rule_5_1_13
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.1.14 | Ensure sshd post-quantum cryptography key exchange algorithms are configured"
  when:
    - cis_ubuntu2604_rule_5_1_14
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1
  block:
    # KexAlgorithms line is written by 5.1.13 using cis_ubuntu2604_ssh_kex_algorithms_effective,
    # which already contains sntrup761x25519-sha512 and mlkem768x25519-sha256 (OpenSSH >= 9.9).
    - name: "SECTION5 | 5.1.14 | verify running sshd offers the PQ KEX algorithms"
      ansible.builtin.shell: set -o pipefail && sshd -T 2>/dev/null | awk '$1 == "kexalgorithms" {print $2}'
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: _cis_sshd_kex
      changed_when: false
      check_mode: false
    - name: "SECTION5 | 5.1.14 | warn if missing (sshd not yet reloaded, or a drop-in overrides KexAlgorithms)"
      ansible.builtin.debug:
        msg: "sshd KexAlgorithms is missing {{ cis_ubuntu2604_ssh_pq_kex | difference(_cis_sshd_kex.stdout.split(',')) }}"
      when: cis_ubuntu2604_ssh_pq_kex | difference(_cis_sshd_kex.stdout.split(',')) | length > 0

