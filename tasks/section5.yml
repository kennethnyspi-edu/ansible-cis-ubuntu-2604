        create: true
        owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
        group: "{{ cis_ubuntu2604_section5_group_ssh }}"
        mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
      when:
        - cis_ubuntu2604_ssh_deny_users is defined
    - name: "SECTION5 | 5.1.5 | Ensure sshd access is configured | DenyGroups"
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "{{ cis_ubuntu2604_regex_base_search }}DenyGroups"
        line: "DenyGroups {{ cis_ubuntu2604_ssh_deny_groups }}"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
        group: "{{ cis_ubuntu2604_section5_group_ssh }}"
        mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
      when:
        - cis_ubuntu2604_ssh_deny_groups is defined

