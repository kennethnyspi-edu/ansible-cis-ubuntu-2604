- name: "SECTION5 | 5.4.1.1 | Ensure password expiration is configured"
  when:
    - cis_ubuntu2604_rule_5_4_1_1
  tags:
    - rule_5_4_1
    - server_l1
    - workstation_l1
  block:

    - name: "SECTION5 | 5.4.1.1 | Ensure password expiration is configured | set inside '/etc/login.defs'"
      ansible.builtin.lineinfile:
        dest: /etc/login.defs
        regexp: "{{ cis_ubuntu2604_regex_base_search }}PASS_MAX_DAYS"
        line: "PASS_MAX_DAYS {{ cis_ubuntu2604_password_pass_max_days }}"
        state: present
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: "SECTION5 | 5.4.1.1 | Ensure password expiration is configured | Gather getent passwd facts"
      ansible.builtin.getent:
        database: passwd

    # Build a list of accounts that need their maxdays changed.
    # Rules:
    #  - Exclude 'root'
    #  - Only consider real users (UID >= 1000)
    #  - Account must have a hashed password in /etc/shadow (shadow field begins with $y, $5, $6 or $g)
    #  - Max days (field 6 in shadow, index 5) is either empty/zero/less than 1 or greater than desired value

    - name: "SECTION5 | 5.4.1.1 | Find accounts needing password maxdays update (with exceptions)"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: -v MAX="${MAX}" -v EXCEPT="{{ cis_ubuntu2604_sudo_nopasswd_exceptions | join(",") }}" '
          BEGIN {
            n = split(EXCEPT, e, ",")
            for (i=1; i<=n; i++) skip[e[i]] = 1
          }
          NR==FNR { shadow[$1] = $0; next }
          $3 >= 1000 && $1 != "root" && !($1 in skip) {
            if (shadow[$1] ~ /^\$[y56g]/) {
              split(shadow[$1], s, ":")
              if (s[6] == "" || s[6] ~ /^[^0-9]/ || (s[6] + 0) > (MAX + 0) || (s[6] + 0) < 1) {
                print $1
              }
            }
          }
        ' /etc/shadow /etc/passwd
      args:
        executable: /bin/bash
      register: cis_ubuntu2604_expiration_users_raw
      changed_when: false
      failed_when: false
      check_mode: false
      environment:
        MAX: "{{ cis_ubuntu2604_password_pass_max_days }}"

    - name: "SECTION5 | 5.4.1.1 | Debug: users found that will be updated"
      ansible.builtin.debug:
        msg: "{{ cis_ubuntu2604_expiration_users_raw.stdout_lines | default([]) }}"
      when: cis_ubuntu2604_expiration_users_raw.stdout_lines is defined

    - name: "SECTION5 | 5.4.1.1 | Update password expiration (chage --maxdays) for found users (non-interactive)"
      become: true
      become_method: sudo
      ansible.builtin.command:
        cmd: chage --maxdays {{ cis_ubuntu2604_password_pass_max_days }} {{ item }}
      loop: "{{ cis_ubuntu2604_expiration_users_raw.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ item }}"
      register: cis_ubuntu2604_chage_results
      changed_when: "'changed' in cis_ubuntu2604_chage_results and (cis_ubuntu2604_chage_results.changed | default(false))"
      failed_when: false
      when:
        - cis_ubuntu2604_expiration_users_raw.stdout_lines is defined
        - cis_ubuntu2604_expiration_users_raw.stdout_lines | length > 0

    - name: "SECTION5 | 5.4.1.1 | Report chage command results"
      ansible.builtin.debug:
        var: cis_ubuntu2604_chage_results.results
      when: cis_ubuntu2604_chage_results is defined

