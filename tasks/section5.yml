- name: "SECTION5 | 5.4.1.5 | Ensure inactive password lock is configured"
  when:
    - cis_ubuntu2604_rule_5_4_1_5
  tags:
    - rule_5_4_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.1.5 | Ensure inactive password lock is configured | set inside '/etc/default/useradd'"
      ansible.builtin.lineinfile:
        dest: /etc/default/useradd
        regexp: "{{ cis_ubuntu2604_regex_base_search }}INACTIVE{{ cis_ubuntu2604_regex_base_search_equals }}"
        line: "INACTIVE={{ cis_ubuntu2604_password_inactive }}"
        state: present
        create: true
        owner: root
        group: root
        mode: "0644"
    - name: "SECTION5 | 5.4.1.5 | Ensure inactive password lock is configured | find user with wrong inactive value"
      ansible.builtin.shell: |
        set -o pipefail &&
        awk -F: '($2~/^\$.+\$/) {if($7 > {{ cis_ubuntu2604_password_inactive }} || $7 < 0) print $1}' /etc/shadow
