---
# tasks file for ansible-cis-ubuntu-2604

# ------------------------------------------------------------------------------

- name: "SECTION5 | EXT ext_ssh_cleanup | EXTENDED | Ensure on /etc/ssh/sshd_config comments and empty lines are removed"
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "^#|^$"
    state: absent
  when:
    - cis_ubuntu2604_ext_ssh_cleanup
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.1.1 | Ensure access to /etc/ssh/sshd_config is configured"
  ansible.builtin.file:
    dest: /etc/ssh/sshd_config
    owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
    group: "{{ cis_ubuntu2604_section5_group_ssh }}"
    mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
  when:
    - cis_ubuntu2604_rule_5_1_1
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.1.2 | Ensure access to /etc/ssh/sshd_config.d/ directory is configured"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - cis_ubuntu2604_rule_5_1_2
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.1.3 | Ensure access to SSH private host key files is configured"
  when:
    - cis_ubuntu2604_rule_5_1_3
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.1.3 | Ensure permissions on SSH private host key files are configured | find ssh_host_*_key"
      ansible.builtin.find:
        paths: /etc/ssh
        file_type: file
        patterns: "ssh_host_*_key"
      register: cis_ubuntu2604_find_ssh_private_host_keys
    - name: "SECTION5 | 5.1.3 | Ensure permissions on SSH private host key files are configured | set permissions"
      ansible.builtin.file:
        dest: "{{ item.path }}"
        owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
        group: "{{ cis_ubuntu2604_section5_group_ssh }}"
        mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
      with_items: "{{ cis_ubuntu2604_find_ssh_private_host_keys.files }}"

- name: "SECTION5 | 5.1.4 | Ensure access to SSH public host key files is configured"
  when:
    - cis_ubuntu2604_rule_5_1_4
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.1.4 | Ensure permissions on SSH public host key files are configured | find ssh_host_*_key.pub"
      ansible.builtin.find:
        paths: /etc/ssh
        patterns: "ssh_host_*_key.pub"
      register: cis_ubuntu2604_find_ssh_public_host_keys
    - name: "SECTION5 | 5.1.4 | Ensure permissions on SSH public host key files are configured | set permissions"
      ansible.builtin.file:
        dest: "{{ item.path }}"
        owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
        group: "{{ cis_ubuntu2604_section5_group_ssh }}"
        mode: "{{ cis_ubuntu2604_section5_mode_ssh_pub }}"
      with_items: "{{ cis_ubuntu2604_find_ssh_public_host_keys.files }}"

- name: "SECTION5 | 5.1.5 | Ensure sshd access is configured"
  when:
    - cis_ubuntu2604_rule_5_1_5
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.1.5 | Ensure sshd access is configured | AllowUsers"
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "{{ cis_ubuntu2604_regex_base_search }}AllowUsers"
        line: "AllowUsers {{ cis_ubuntu2604_ssh_allow_users }}"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
        group: "{{ cis_ubuntu2604_section5_group_ssh }}"
        mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
      when:
        - cis_ubuntu2604_ssh_allow_users is defined
    - name: "SECTION5 | 5.1.5 | Ensure sshd access is configured | AllowGroups"
      ansible.builtin.lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "{{ cis_ubuntu2604_regex_base_search }}AllowGroups"
