# ------------------------------------------------------------------------------

- name: "SECTION5 | EXT ext_ssh_hardening | EXTENDED | Ensure SSH additional variables are configured"
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    regexp: "{{ item.reg }}"
    line: "{{ item.line }}"
    state: present
    create: true
    owner: "{{ cis_ubuntu2604_section5_owner_ssh }}"
    group: "{{ cis_ubuntu2604_section5_group_ssh }}"
    mode: "{{ cis_ubuntu2604_section5_mode_ssh }}"
  with_items:
    - reg: "{{ cis_ubuntu2604_regex_base_search }}Port"
      line: "Port {{ cis_ubuntu2604_ssh_port }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}AddressFamily"
      line: "AddressFamily {{ cis_ubuntu2604_ssh_address_family }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}ListenAddress"
      line: "ListenAddress 0.0.0.0"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}AuthenticationMethods"
      line: "AuthenticationMethods {{ cis_ubuntu2604_ssh_authentication_methods }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}StrictModes"
      line: "StrictModes yes"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}PubkeyAuthentication"
      line: "PubkeyAuthentication yes"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}PasswordAuthentication"
      line: "PasswordAuthentication {{ cis_ubuntu2604_ssh_password_authentication }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}ChallengeResponseAuthentication"
      line: "ChallengeResponseAuthentication no"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}GSSAPICleanupCredentials"
      line: "GSSAPICleanupCredentials yes"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}AllowAgentForwarding"
      line: "AllowAgentForwarding {{ cis_ubuntu2604_ssh_allow_agent_forwarding }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}X11Forwarding"
      line: "X11Forwarding {{ cis_ubuntu2604_ssh_x11_forwarding }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}AllowTcpForwarding"
      line: "AllowTcpForwarding {{ cis_ubuntu2604_ssh_allow_tcp_forwarding }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}PrintMotd"
      line: "PrintMotd no"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}TCPKeepAlive"
      line: "TCPKeepAlive {{ cis_ubuntu2604_ssh_tcp_keep_alive }}"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}UseDNS"
      line: "UseDNS no"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}AcceptEnv"
      line: "AcceptEnv LANG LC_*"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}AuthorizedKeysFile"
      line: "AuthorizedKeysFile .ssh/authorized_keys"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}Subsystem"
      line: "Subsystem sftp  /usr/lib/ssh/sftp-server -f AUTHPRIV -l INFO"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}HostKey /etc/ssh/ssh_host_ed25519_key"
      line: "HostKey /etc/ssh/ssh_host_ed25519_key"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}HostKey /etc/ssh/ssh_host_ecdsa_key"
      line: "HostKey /etc/ssh/ssh_host_ecdsa_key"
    - reg: "{{ cis_ubuntu2604_regex_base_search }}HostKey /etc/ssh/ssh_host_rsa_key"
      line: "HostKey /etc/ssh/ssh_host_rsa_key"
  when:
    - cis_ubuntu2604_ext_ssh_hardening
    - (
      (cis_ubuntu2604_ext_ssh_pubkey_key is defined
      and cis_ubuntu2604_ext_ssh_pubkey_key is not none)
      or cis_ubuntu2604_ssh_password_authentication == 'yes')
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1

- name: "SECTION5 | EXT ext_ssh_pubkey | EXTENDED | Ensure sshd public key is added"
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ cis_ubuntu2604_ext_ssh_pubkey_key }}"
    state: present
    exclusive: true
  when:
    - cis_ubuntu2604_ext_ssh_pubkey
    - cis_ubuntu2604_ext_ssh_pubkey_key is defined
    - cis_ubuntu2604_ext_ssh_pubkey_key is not none
    - service_status_ssh.stdout in ('loadedactive','loadedinactive')
  tags:
    - rule_5_1
    - server_l1
    - workstation_l1

# ------------------------------------------------------------------------------

- name: "SECTION5 | 5.2.1 | Ensure sudo is installed"
  ansible.builtin.apt:
    # 26.04: 'sudo-rs' provides /usr/lib/cargo/bin/sudo; 'sudo' provides sudo.ws (C sudo)
    name: "{{ 'sudo-rs' if cis_ubuntu2604_sudo_provider == 'sudo-rs' else 'sudo' }}"
    state: present
    force_apt_get: true
  when:
    - cis_ubuntu2604_rule_5_2_1
  tags:
    - rule_5_2
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.2.2 | Ensure sudo commands use pty"
  when:
    - cis_ubuntu2604_rule_5_2_2
  tags:
    - rule_5_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.2.2 | Ensure sudo commands use pty | update /etc/sudoers"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: '{{ cis_ubuntu2604_regex_base_search }}Defaults\s+use_pty'
        line: "Defaults use_pty"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section5_owner_sudo }}"
        group: "{{ cis_ubuntu2604_section5_group_sudo }}"
        mode: "{{ cis_ubuntu2604_section5_mode_sudo }}"
        validate: "visudo -cf %s"
    - name: "SECTION5 | 5.2.2 | Ensure sudo commands use pty | search files inside '/etc/sudoers.d/*'"
      ansible.builtin.find:
        paths: /etc/sudoers.d/
        patterns: "*"
        recurse: yes
      register: cis_ubuntu2604_sudoers_d_files
    - name: "SECTION5 | 5.2.2 | Ensure sudo commands use pty | update '/etc/sudoers.d/*'"
      ansible.builtin.lineinfile:
        dest: "{{ item.path }}"
        regexp: "!use_pty"
        state: absent
        validate: "visudo -cf %s"
      with_items: "{{ cis_ubuntu2604_sudoers_d_files.files }}"

- name: "SECTION5 | 5.2.3 | Ensure sudo log file exists"
  when:
    - cis_ubuntu2604_rule_5_2_3
  tags:
    - rule_5_2
    - server_l1
    - workstation_l1
  block:
    # sudo.ws: classic 'Defaults logfile=' (sudo-rs does not implement 'logfile')
    - name: "SECTION5 | 5.2.3 | Ensure sudo log file exists | sudo.ws logfile"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: '{{ cis_ubuntu2604_regex_base_search }}Defaults\s+logfile.*'
        line: 'Defaults logfile="{{ cis_ubuntu2604_audit_sudo_log_file }}"'
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section5_owner_sudo }}"
        group: "{{ cis_ubuntu2604_section5_group_sudo }}"
        mode: "{{ cis_ubuntu2604_section5_mode_sudo }}"
        validate: "visudo -cf %s"
      when: not cis_ubuntu2604_sudo_is_rs | bool

    # sudo-rs: logs only to syslog. Split 'sudo' syslog messages into the same file via rsyslog.
    - name: "SECTION5 | 5.2.3 | Ensure sudo log file exists | sudo-rs rsyslog routing"
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/40-cis-sudo.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by ansible-cis-ubuntu-2604 (5.2.3 compensating control for sudo-rs)
          if $programname == 'sudo' then {{ cis_ubuntu2604_audit_sudo_log_file }}
      notify: Restart rsyslog
      when:
        - cis_ubuntu2604_sudo_is_rs | bool
        - cis_ubuntu2604_sudo_rs_rsyslog_logfile | bool
        - cis_ubuntu2604_preferred_capturing_log_method == "rsyslog"

    - name: "SECTION5 | 5.2.3 | Ensure sudo log file exists | sudo-rs: drop unsupported logfile directive"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: '{{ cis_ubuntu2604_regex_base_search }}Defaults\s+logfile.*'
        state: absent
        validate: "visudo -cf %s"
      when: cis_ubuntu2604_sudo_is_rs | bool

    - name: "SECTION5 | 5.2.3 | Ensure sudo log file exists | ensure file"
      ansible.builtin.file:
        path: "{{ cis_ubuntu2604_audit_sudo_log_file }}"
        state: touch
        owner: root
        group: adm
        mode: "0640"
        modification_time: preserve
        access_time: preserve

- name: "SECTION5 | 5.2.4 | Ensure users must provide password for escalation"
  when:
    - cis_ubuntu2604_rule_5_2_4
  tags:
    - rule_5_2
    - server_l2
    - workstation_l2
  block:
#    - name: "SECTION5 | 5.2.4 | Ensure users must provide password for privilege escalation | update /etc/sudoers"
#      ansible.builtin.replace:
#        path: /etc/sudoers
#        regexp: "^(?!#)(.*NOPASSWD.*)"
#        replace: '#\1'
#        validate: "visudo -cf %s"

    - name: "SECTION5 | 5.2.4 | Comment NOPASSWD entries in /etc/sudoers (except ubuntu, ec2-user)"
      ansible.builtin.replace:
        path: /etc/sudoers
        # NOTE: 24.04 used a folded (>-) scalar here, which injected literal spaces/newlines into
        # the pattern so it never matched. Single-line pattern below actually works.
        regexp: '^(?!#)(?!\s*(?:{{ cis_ubuntu2604_sudo_nopasswd_exceptions | map("regex_escape") | join("|") }})\b)(.*NOPASSWD.*)$'
        replace: '#\1'
        validate: "visudo -cf %s"

    - name: "SECTION5 | 5.2.4 | Ensure users must provide password for privilege escalation | search files inside '/etc/sudoers.d/*'"
      ansible.builtin.find:
        paths: /etc/sudoers.d/
        patterns: "*"
        recurse: yes
      register: cis_ubuntu2604_sudoers_d_files

#    - name: "SECTION5 | 5.2.4 | Ensure users must provide password for privilege escalation | update '/etc/sudoers.d/*'"
#      ansible.builtin.replace:
#        path: "{{ item.path }}"
#        regexp: "^(?!#)(.*NOPASSWD.*)"
#        replace: '#\1'
#        validate: "visudo -cf %s"
#      with_items: "{{ cis_ubuntu2604_sudoers_d_files.files }}"

    - name: "SECTION5 | 5.2.4 | Comment NOPASSWD entries in sudoers.d (except ubuntu, ec2-user)"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        # NOTE: 24.04 used a folded (>-) scalar here, which injected literal spaces/newlines into
        # the pattern so it never matched. Single-line pattern below actually works.
        regexp: '^(?!#)(?!\s*(?:{{ cis_ubuntu2604_sudo_nopasswd_exceptions | map("regex_escape") | join("|") }})\b)(.*NOPASSWD.*)$'
        replace: '#\1'
        validate: "visudo -cf %s"
      loop: "{{ cis_ubuntu2604_sudoers_d_files.files }}"

- name: "SECTION5 | 5.2.5 | Ensure re-authentication for privilege escalation is not disabled globally"
  when:
    - cis_ubuntu2604_rule_5_2_5
  tags:
    - rule_5_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.2.5 | Ensure re-authentication for privilege escalation is not disabled globally | update /etc/sudoers"
      ansible.builtin.replace:
        path: /etc/sudoers
        regexp: "^(?!#)(.*!authenticate.*)"
        replace: '#\1'
        validate: "visudo -cf %s"

    - name: "SECTION5 | 5.2.5 | Ensure re-authentication for privilege escalation is not disabled globally | search files inside '/etc/sudoers.d/*'"
      ansible.builtin.find:
        paths: /etc/sudoers.d/
        patterns: "*"
        recurse: yes
      register: cis_ubuntu2604_sudoers_d_files

    - name: "SECTION5 | 5.2.5 | Ensure re-authentication for privilege escalation is not disabled globally | update '/etc/sudoers.d/*'"
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: "^(?!#)(.*!authenticate.*)"
        replace: '#\1'
        validate: "visudo -cf %s"
      with_items: "{{ cis_ubuntu2604_sudoers_d_files.files }}"

- name: "SECTION5 | 5.2.6 | Ensure sudo timestamp_timeout is configured"
  when:
    - cis_ubuntu2604_rule_5_2_6
  tags:
    - rule_5_2
    - server_l1
    - workstation_l1
  vars:
    # sudo.ws: keep the 24.04 combined form. sudo-rs: env_reset is always on and not a
    # documented Defaults flag, so write timestamp_timeout on its own line.
    _cis_sudo_timeout_line: >-
      {{ 'Defaults timestamp_timeout=' ~ cis_ubuntu2604_sudo_timestamp_timeout
         if cis_ubuntu2604_sudo_is_rs | bool
         else 'Defaults env_reset, timestamp_timeout=' ~ cis_ubuntu2604_sudo_timestamp_timeout }}
  block:
    - name: "SECTION5 | 5.2.6 | Ensure sudo authentication timeout is configured correctly | remove other timestamp_timeout lines"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: '{{ cis_ubuntu2604_regex_base_search }}Defaults\s+(env_reset,\s*)?timestamp_timeout=(?!{{ cis_ubuntu2604_sudo_timestamp_timeout }}$).*'
        state: absent
        validate: "visudo -cf %s"
    - name: "SECTION5 | 5.2.6 | Ensure sudo authentication timeout is configured correctly | remove standalone env_reset (sudo.ws only)"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: '{{ cis_ubuntu2604_regex_base_search }}Defaults\s+env_reset$'
        state: absent
        validate: "visudo -cf %s"
      when: not cis_ubuntu2604_sudo_is_rs | bool
    - name: "SECTION5 | 5.2.6 | Ensure sudo authentication timeout is configured correctly | set timestamp_timeout"
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: '{{ cis_ubuntu2604_regex_base_search }}Defaults\s+(env_reset,\s*)?timestamp_timeout=.*'
        line: "{{ _cis_sudo_timeout_line }}"
        state: present
        create: true
        owner: "{{ cis_ubuntu2604_section5_owner_sudo }}"
        group: "{{ cis_ubuntu2604_section5_group_sudo }}"
        mode: "{{ cis_ubuntu2604_section5_mode_sudo }}"
        validate: "visudo -cf %s"

- name: "SECTION5 | 5.2.7 | Ensure access to the su command is restricted"
  when:
    - cis_ubuntu2604_rule_5_2_7
  tags:
    - rule_5_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.2.7 | Ensure access to the su command is restricted | create group"
      ansible.builtin.group:
        name: sugroup
        state: present
        system: true
    - name: "SECTION5 | 5.2.7 | Ensure access to the su command is restricted | set pam su"
      ansible.builtin.lineinfile:
        dest: /etc/pam.d/su
        regexp: '{{ cis_ubuntu2604_regex_base_search }}auth\s+required\s+pam_wheel\.so\s+use_uid\s+group='
        line: "auth required pam_wheel.so use_uid group=sugroup"
        state: present
        create: true
        owner: root
        group: root
        mode: "0644"

