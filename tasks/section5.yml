- name: "SECTION5 | 5.4.2.1 | Ensure root is the only UID 0 account"
  when:
    - cis_ubuntu2604_rule_5_4_2_1
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.2.1 | Ensure root is the only UID 0 account | root 0"
      ansible.builtin.user:
        name: root
        uid: 0
    - name: "SECTION5 | 5.4.2.1 | Ensure root is the only UID 0 account | verify that only 'root' is returned"
      ansible.builtin.shell: |
        set -o pipefail &&
        awk -F: '($3 == 0) { print $1 }' /etc/passwd
      args:
        executable: /bin/bash
      register: cis_ubuntu2604_verify_only_root_returned
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION5 | 5.4.2.1 | Ensure root is the only UID 0 account | print info"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          Modify any users other than root with UID 0 and assign them a new UID.
          #############################################################################################
          {{ cis_ubuntu2604_verify_only_root_returned.stdout_lines | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################
      when:
        - cis_ubuntu2604_verify_only_root_returned.stdout_lines is defined
        - cis_ubuntu2604_verify_only_root_returned.stdout_lines | length > 0

- name: "SECTION5 | 5.4.2.2 | Ensure root is the only GID 0 account"
  when:
    - cis_ubuntu2604_rule_5_4_2_2
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.2.2 | Ensure root is the only GID 0 account | user group"
      ansible.builtin.user:
        name: root
        group: root
    - name: "SECTION5 | 5.4.2.2 | Ensure root is the only GID 0 account | group gid"
      ansible.builtin.group:
        name: root
        gid: 0
    - name: "SECTION5 | 5.4.2.2 | Ensure root is the only GID 0 account | verify GID 0"
      ansible.builtin.shell: |
        set -o pipefail &&
        awk -F: '($1 !~ /^(sync|shutdown|halt|operator)/ && $4=="0") {print $1":"$4}' /etc/passwd
      args:
        executable: /bin/bash
      register: cis_ubuntu2604_verify_primary_gid_root
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION5 | 5.4.2.2 | Ensure root is the only GID 0 account | print info"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          Remove any users other than the root user with GID 0 or assign them a new GID if appropriate.
          #############################################################################################
          {{ cis_ubuntu2604_verify_primary_gid_root.stdout_lines | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################
      when:
        - cis_ubuntu2604_verify_primary_gid_root.stdout_lines is defined
        - cis_ubuntu2604_verify_primary_gid_root.stdout_lines | length > 0

- name: "SECTION5 | 5.4.2.3 | Ensure group root is the only GID 0 group"
  when:
    - cis_ubuntu2604_rule_5_4_2_3
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.2.3 | Ensure group root is the only GID 0 group | root GID 0"
      ansible.builtin.group:
        name: root
        gid: 0
    - name: "SECTION5 | 5.4.2.3 | Ensure group root is the only GID 0 group | verify GID 0"
      ansible.builtin.shell: |
        set -o pipefail &&
        awk -F: '$3=="0"{print $1":"$3}' /etc/group
      args:
        executable: /bin/bash
      register: cis_ubuntu2604_verify_root_only_gid_root
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION5 | 5.4.2.3 | Ensure group root is the only GID 0 group | print info"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          Remove any groups other than the root group with GID 0 or assign them a new GID if appropriate.
          #############################################################################################
          {{ cis_ubuntu2604_verify_root_only_gid_root.stdout_lines | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################
      when:
        - cis_ubuntu2604_verify_root_only_gid_root.stdout_lines is defined
        - cis_ubuntu2604_verify_root_only_gid_root.stdout_lines | length > 0

- name: "SECTION5 | 5.4.2.4 | Ensure root account access is controlled"
  ansible.builtin.user:
    name: root
    password_lock: true
  when:
    - cis_ubuntu2604_rule_5_4_2_4
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.4.2.5 | Ensure root path integrity"
  when:
    - cis_ubuntu2604_rule_5_4_2_5
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.2.5 | Ensure root path integrity | get list for root path Integrity"
      ansible.builtin.shell: |
        set -o pipefail
        {
          l_output2=""
          l_pmask="0022"
          l_maxperm="$(printf '%o' $((0777 & ~$l_pmask)))"
          l_root_path="$(sudo -Hiu root env | grep '^PATH' | cut -d= -f2)"
          unset a_path_loc && IFS=":" read -ra a_path_loc <<<"$l_root_path"
          grep -q "::" <<<"$l_root_path" && l_output2="$l_output2\n - root's path contains a empty directory (::)"
          grep -Pq ":\h*$" <<<"$l_root_path" && l_output2="$l_output2\n - root's path contains a trailing (:)"
          grep -Pq '(\h+|:)\.(:|\h*$)' <<<"$l_root_path" && l_output2="$l_output2\n - root's path contains current working directory (.)"
          while read -r l_path; do
            if [ -d "$l_path" ]; then
              while read -r l_fmode l_fown; do
                [ "$l_fown" != "root" ] && l_output2="$l_output2\n - Directory: \"$l_path\" is owned by: \"$l_fown\" should be owned by \"root\""
                [ $(($l_fmode & $l_pmask)) -gt 0 ] && l_output2="$l_output2\n - Directory: \"$l_path\" is mode: \"$l_fmode\" and should be mode: \"$l_maxperm\" or more restrictive"
              done <<<"$(stat -Lc '%#a %U' "$l_path")"
            else
              l_output2="$l_output2\n - \"$l_path\" is not a directory"
            fi
          done <<<"$(printf "%s\n" "${a_path_loc[@]}")"
          if [ -z "$l_output2" ]; then
            echo -e "\n- Audit Result:\n  *** PASS ***\n - Root's path is correctly configured\n"
          else
            echo -e "\n- Audit Result:\n  ** FAIL **\n - * Reasons for audit failure * :\n$l_output2\n"
          fi
        }
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_root_path_integrity
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION5 | 5.4.2.5 | Ensure root path integrity | print info"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          Correct or justify any:

          - Locations that are not directories
          - Empty directories (::)
          - Trailing (:)
          - Current working directory (.)
          - Non root owned directories
          - Directories that less restrictive than mode 0755
          #############################################################################################
          {{ cis_ubuntu2604_root_path_integrity.stdout_lines | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################
      when:
        - cis_ubuntu2604_root_path_integrity.stdout_lines is defined
        - cis_ubuntu2604_root_path_integrity.stdout_lines | length > 0

- name: "SECTION5 | 5.4.2.6 | Ensure root user umask is configured"
  ansible.builtin.lineinfile:
    dest: "{{ item }}"
    regexp: "{{ cis_ubuntu2604_regex_base_search }}umask"
    line: "umask 0027"
    state: present
    create: true
    owner: root
    group: root
    mode: "0640"
  with_items:
    - /root/.bash_profile
    - /root/.bashrc
  when:
    - cis_ubuntu2604_rule_5_4_2_6
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1

- name: "SECTION5 | 5.4.2.7 | Ensure system accounts do not have a valid login shell"
  when:
    - cis_ubuntu2604_rule_5_4_2_7
  tags:
    - rule_5_4_2
    - server_l1
    - workstation_l1
  block:
    - name: "SECTION5 | 5.4.2.7 | Ensure system accounts do not have a valid login shell | gather information"
      ansible.builtin.shell: |
        set -o pipefail
        {
          l_valid_shells="^($(awk -F\/ '$NF != "nologin" {print}' /etc/shells | sed -rn '/^\//{s,/,\\\\/,g;p}' | paste -s -d '|' -))$"
          awk -v pat="$l_valid_shells" -F: '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3<'"$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"' || $3 == 65534) && $(NF) ~ pat) {system ("usermod -s '"$(command -v nologin)"' " $1)}' /etc/passwd
        }
      args:
        executable: "{{ cis_ubuntu2604_shell_executable }}"
      register: cis_ubuntu2604_system_accounts_do_not_have_valid_login_shell
      changed_when: false
      failed_when: false
      check_mode: false
    - name: "SECTION5 | 5.4.2.7 | Ensure system accounts do not have a valid login shell | print info"
      ansible.builtin.debug:
        msg: |
          #############################################################################################
          Verify system accounts, except for root, halt, sync, shutdown or nfsnobody, do not have a valid login shell
          #############################################################################################
          {{ cis_ubuntu2604_system_accounts_do_not_have_valid_login_shell.stdout_lines | join(cis_ubuntu2604_print_info_join_by) }}
          #############################################################################################
      when:
        - cis_ubuntu2604_system_accounts_do_not_have_valid_login_shell.stdout_lines is defined
        - cis_ubuntu2604_system_accounts_do_not_have_valid_login_shell.stdout_lines | length > 0
