---
name: Ansible Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

jobs:
  build:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: python3 -m pip install ansible-lint

      - name: Install collections (bypass Galaxy response cache, retry once)
        run: |
          ansible-galaxy collection install -r requirements.yml --no-cache \
            || { sleep 20; ansible-galaxy collection install -r requirements.yml --no-cache; }

      - name: Run ansible-lint
        run: ansible-lint --offline
